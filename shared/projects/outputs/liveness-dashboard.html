<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Liveness Dashboard</title>
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --border: #2a2d3a;
  --text: #e4e4e7;
  --muted: #71717a;
  --green: #22c55e;
  --yellow: #eab308;
  --red: #ef4444;
  --blue: #3b82f6;
  --purple: #a855f7;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 24px; }
h1 { font-size: 1.5rem; margin-bottom: 4px; }
.subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 24px; }
.tabs { display: flex; gap: 2px; margin-bottom: 24px; border-bottom: 1px solid var(--border); }
.tab { padding: 8px 16px; cursor: pointer; border-bottom: 2px solid transparent; color: var(--muted); font-size: 0.85rem; }
.tab.active { color: var(--text); border-bottom-color: var(--blue); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
.card h3 { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
.card .value { font-size: 1.8rem; font-weight: 600; }
.timeline { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.timeline-header { padding: 16px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 0.9rem; }
.timeline-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); transition: background 0.15s; }
.timeline-item:hover { background: rgba(59,130,246,0.05); }
.timeline-item:last-child { border-bottom: none; }
.pulse { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
.pulse.alive { background: var(--green); box-shadow: 0 0 6px var(--green); animation: pulse 2s infinite; }
.pulse.stale { background: var(--yellow); }
.pulse.dead { background: var(--red); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
.item-content { flex: 1; min-width: 0; }
.item-agent { font-weight: 600; font-size: 0.85rem; }
.item-decision { color: var(--muted); font-size: 0.8rem; margin-top: 2px; }
.item-time { color: var(--muted); font-size: 0.75rem; white-space: nowrap; }
.badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: 600; margin-left: 6px; }
.badge-fork { background: rgba(168,85,247,0.2); color: var(--purple); }
.badge-call { background: rgba(59,130,246,0.2); color: var(--blue); }
.badge-skip { background: rgba(113,113,122,0.2); color: var(--muted); }
.badge-work { background: rgba(34,197,94,0.2); color: var(--green); }
.controls { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
.controls select, .controls input { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 6px; font-size: 0.8rem; }
.refresh-btn { background: var(--blue); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
.refresh-btn:hover { opacity: 0.9; }
#live-indicator { display: inline-flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--green); }
#live-indicator .dot { width: 6px; height: 6px; background: var(--green); border-radius: 50%; animation: pulse 1.5s infinite; }
</style>
</head>
<body>
<div style="display:flex; justify-content:space-between; align-items:center;">
  <div>
    <h1>🫀 Agent Liveness</h1>
    <p class="subtitle">Heartbeat timeline &amp; decision stream</p>
  </div>
  <div id="live-indicator"><span class="dot"></span> Auto-refresh 10s</div>
</div>

<div class="tabs">
  <div class="tab active" data-tab="timeline">Timeline</div>
  <div class="tab" data-tab="agents">By Agent</div>
  <div class="tab" data-tab="decisions">Decisions</div>
</div>

<div class="controls">
  <select id="agent-filter">
    <option value="all">All Agents</option>
  </select>
  <select id="time-filter">
    <option value="60">Last hour</option>
    <option value="360">Last 6 hours</option>
    <option value="1440">Last 24 hours</option>
  </select>
  <button class="refresh-btn" onclick="refreshData()">↻ Refresh</button>
</div>

<div class="grid">
  <div class="card">
    <h3>Active Agents</h3>
    <div class="value" id="active-count">—</div>
  </div>
  <div class="card">
    <h3>Heartbeats (1h)</h3>
    <div class="value" id="heartbeat-count">—</div>
  </div>
  <div class="card">
    <h3>Decisions Made</h3>
    <div class="value" id="decision-count">—</div>
  </div>
  <div class="card">
    <h3>Last Activity</h3>
    <div class="value" id="last-activity" style="font-size:1rem;">—</div>
  </div>
</div>

<div class="timeline">
  <div class="timeline-header">Heartbeat Timeline</div>
  <div id="timeline-content"></div>
</div>

<script>
// Simulated data source - in production this queries session events via API
const AGENTS = ['arc', 'may', 'amy', 'architect', 'bob', 'worker'];
const DECISIONS = [
  { type: 'fork', label: 'Forked task to worker' },
  { type: 'call', label: 'Called sub-agent' },
  { type: 'skip', label: 'Skipped — no pending work' },
  { type: 'work', label: 'Processed pending request' },
  { type: 'work', label: 'Ran health check' },
  { type: 'fork', label: 'Delegated implementation' },
  { type: 'skip', label: 'Cooldown active' },
  { type: 'call', label: 'Queried system status' },
  { type: 'work', label: 'Reviewed completion' },
];

function generateEvents(count) {
  const now = Date.now();
  const events = [];
  for (let i = 0; i < count; i++) {
    const agent = AGENTS[Math.floor(Math.random() * AGENTS.length)];
    const decision = DECISIONS[Math.floor(Math.random() * DECISIONS.length)];
    const timeAgo = Math.floor(Math.random() * 3600000); // within last hour
    events.push({
      agent,
      decision: decision.label,
      type: decision.type,
      timestamp: now - timeAgo,
      alive: timeAgo < 900000 // alive if < 15min ago
    });
  }
  return events.sort((a, b) => b.timestamp - a.timestamp);
}

function formatTime(ts) {
  const diff = Date.now() - ts;
  if (diff < 60000) return `${Math.floor(diff/1000)}s ago`;
  if (diff < 3600000) return `${Math.floor(diff/60000)}m ago`;
  return `${Math.floor(diff/3600000)}h ago`;
}

function renderTimeline(events) {
  const container = document.getElementById('timeline-content');
  container.innerHTML = events.map(ev => `
    <div class="timeline-item">
      <div class="pulse ${ev.alive ? 'alive' : 'stale'}"></div>
      <div class="item-content">
        <div class="item-agent">${ev.agent}<span class="badge badge-${ev.type}">${ev.type}</span></div>
        <div class="item-decision">${ev.decision}</div>
      </div>
      <div class="item-time">${formatTime(ev.timestamp)}</div>
    </div>
  `).join('');
}

function refreshData() {
  const events = generateEvents(20);
  const uniqueAgents = [...new Set(events.filter(e => e.alive).map(e => e.agent))];
  
  document.getElementById('active-count').textContent = uniqueAgents.length;
  document.getElementById('heartbeat-count').textContent = events.length;
  document.getElementById('decision-count').textContent = events.filter(e => e.type !== 'skip').length;
  document.getElementById('last-activity').textContent = formatTime(events[0].timestamp);
  
  renderTimeline(events);
  
  // Populate agent filter
  const filter = document.getElementById('agent-filter');
  const current = filter.value;
  filter.innerHTML = '<option value="all">All Agents</option>' + 
    AGENTS.map(a => `<option value="${a}">${a}</option>`).join('');
  filter.value = current;
}

// Tab switching
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
  });
});

// Auto-refresh
refreshData();
setInterval(refreshData, 10000);
</script>
</body>
</html>
