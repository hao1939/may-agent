<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>may-agent</title>
<style>
  :root {
    --bg: #0d1117; --bg2: #161b22; --bg3: #21262d; --border: #30363d;
    --fg: #c9d1d9; --fg2: #8b949e; --accent: #58a6ff; --green: #3fb950;
    --red: #f85149; --yellow: #d29922; --purple: #bc8cff;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --mono: 'SF Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--fg); font-size: 14px; line-height: 1.5; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* Layout */
  .header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; gap: 16px; }
  .header h1 { font-size: 16px; font-weight: 600; }
  .tabs { display: flex; gap: 4px; }
  .tab { padding: 6px 14px; border-radius: 6px; cursor: pointer; color: var(--fg2); font-size: 13px; }
  .tab:hover { color: var(--fg); background: var(--bg3); }
  .tab.active { color: var(--fg); background: var(--bg3); }
  .main { max-width: 1100px; margin: 0 auto; padding: 20px; }

  /* Stats bar */
  .stats { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .stat { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; min-width: 140px; }
  .stat .label { font-size: 11px; color: var(--fg2); text-transform: uppercase; letter-spacing: 0.5px; }
  .stat .value { font-size: 22px; font-weight: 600; margin-top: 2px; }

  /* Filters */
  .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .filters select, .filters input { background: var(--bg2); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 13px; }
  .filters select:focus, .filters input:focus { outline: none; border-color: var(--accent); }

  /* Request list */
  .request-list { display: flex; flex-direction: column; gap: 2px; }
  .request { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; cursor: pointer; transition: border-color 0.15s; }
  .request:hover { border-color: var(--accent); }
  .request .top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .request .task { color: var(--fg); font-size: 13px; line-height: 1.4; }
  .request .meta { font-size: 12px; color: var(--fg2); margin-top: 4px; }
  .request .outcome { font-size: 12px; color: var(--fg2); margin-top: 4px; font-style: italic; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 500; }
  .badge.done, .badge.COMPLETED { background: rgba(63,185,80,0.15); color: var(--green); }
  .badge.error, .badge.FAILED { background: rgba(248,81,73,0.15); color: var(--red); }
  .badge.running, .badge.CREATED, .badge.IN_PROGRESS { background: rgba(210,153,34,0.15); color: var(--yellow); }
  .badge.interrupted, .badge.BLOCKED { background: rgba(139,148,158,0.15); color: var(--fg2); }
  .badge.source { background: rgba(88,166,255,0.1); color: var(--accent); }
  .badge.agent { background: rgba(188,140,255,0.1); color: var(--purple); }

  /* Session detail panel */
  .panel { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-top: 16px; }
  .panel h3 { font-size: 14px; margin-bottom: 12px; }
  .tree-node { margin-left: 20px; padding: 8px 0; border-left: 2px solid var(--border); padding-left: 12px; }
  .tree-node .agent { font-weight: 600; color: var(--purple); }
  .tree-node .task-preview { color: var(--fg2); font-size: 12px; }
  .tree-node .outcome-preview { color: var(--fg2); font-size: 12px; font-style: italic; }

  /* Transcript */
  .transcript { max-height: 600px; overflow-y: auto; }
  .msg { padding: 8px 12px; border-radius: 6px; margin-bottom: 4px; font-size: 13px; }
  .msg.user { background: rgba(88,166,255,0.08); border-left: 3px solid var(--accent); }
  .msg.assistant { background: var(--bg); }
  .msg.tool_call { background: rgba(210,153,34,0.06); font-family: var(--mono); font-size: 12px; }
  .msg.tool_result { background: rgba(63,185,80,0.06); font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-all; }
  .msg.tool_result.error { background: rgba(248,81,73,0.06); }

  /* Chat */
  .chat-container { display: flex; flex-direction: column; height: calc(100vh - 120px); }
  .chat-messages { flex: 1; overflow-y: auto; padding: 12px 0; }
  .chat-input-row { display: flex; gap: 8px; padding-top: 12px; border-top: 1px solid var(--border); }
  .chat-input-row input { flex: 1; background: var(--bg2); color: var(--fg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font-size: 14px; }
  .chat-input-row input:focus { outline: none; border-color: var(--accent); }
  .chat-input-row button { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 10px 20px; cursor: pointer; font-size: 14px; }
  .chat-input-row button:hover { opacity: 0.9; }
  .chat-status { font-size: 12px; color: var(--fg2); padding: 4px 0; }

  /* Action buttons */
  .ask-btn { background: var(--bg3); color: var(--fg2); border: 1px solid var(--border); border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: 12px; }
  .ask-btn:hover { color: var(--fg); border-color: var(--accent); }

  /* Pagination */
  .pagination { display: flex; gap: 8px; margin-top: 16px; justify-content: center; }
  .pagination button { background: var(--bg2); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 14px; cursor: pointer; font-size: 13px; }
  .pagination button:hover { border-color: var(--accent); }
  .pagination button:disabled { opacity: 0.4; cursor: default; }

  .hidden { display: none; }
  .msg.assistant.md-rendered h1, .msg.assistant.md-rendered h2, .msg.assistant.md-rendered h3 { font-size: 14px; margin: 8px 0 4px; color: var(--accent); }
  .msg.assistant.md-rendered p { margin: 4px 0; }
  .msg.assistant.md-rendered code { background: var(--bg3); padding: 1px 4px; border-radius: 3px; font-family: var(--mono); font-size: 12px; }
  .msg.assistant.md-rendered pre { background: var(--bg3); padding: 8px; border-radius: 6px; overflow-x: auto; font-size: 12px; }
  .msg.assistant.md-rendered pre code { background: none; padding: 0; }
  .msg.assistant.md-rendered ul, .msg.assistant.md-rendered ol { margin: 4px 0; padding-left: 20px; }
  .msg.assistant.md-rendered table { border-collapse: collapse; margin: 8px 0; font-size: 12px; }
  .msg.assistant.md-rendered td, .msg.assistant.md-rendered th { padding: 4px 8px; border: 1px solid var(--border); }
  .msg.assistant.md-rendered strong { color: var(--fg); }
</style>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
<div class="header">
  <h1>may-agent</h1>
  <div class="tabs">
    <div class="tab active" data-tab="dashboard">Dashboard</div>
    <div class="tab" data-tab="chat">Chat</div>
    <div class="tab" data-tab="benchmarks">Benchmarks</div>
  </div>
</div>

<div class="main">
  <!-- Dashboard -->
  <div id="dashboard">
    <div id="digest-panel" style="margin-bottom:20px"></div>
    <div class="stats" id="stats"></div>
    <div class="filters">
      <select id="f-from"><option value="">All sources</option><option value="human">Human</option><option value="cron">Cron</option></select>
      <select id="f-status"><option value="">All statuses</option><option value="COMPLETED">Completed</option><option value="FAILED">Failed</option><option value="CREATED">Active</option></select>
      <input id="f-search" type="text" placeholder="Search task..." style="min-width:200px">
    </div>
    <div class="request-list" id="request-list"></div>
    <div class="pagination" id="pagination"></div>
    <div id="detail-panel"></div>
  </div>

  <!-- Chat -->
  <div id="chat" class="hidden">
    <div class="chat-container">
      <div style="display:flex;align-items:center;gap:8px">
        <div class="chat-status" id="chat-status">Disconnected</div>
        <button class="ask-btn" id="md-toggle" onclick="toggleMarkdown()" style="margin-left:auto;font-size:11px">Raw</button>
      </div>
      <div id="session-picker" style="display:flex;gap:4px;flex-wrap:wrap;padding:4px 0;font-size:12px"></div>
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-input-row">
        <input id="chat-input" type="text" placeholder="Type a message... (sends to selected session)" autocomplete="off">
        <button id="chat-send">Send</button>
      </div>
    </div>
  </div>

  <!-- Benchmarks -->
  <div id="benchmarks" class="hidden">
    <div id="benchmark-content"></div>
  </div>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────────
let currentTab = location.hash.slice(1) || 'dashboard';
let offset = 0;
const limit = 30;

// ── Tabs ──────────────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentTab = tab.dataset.tab;
    location.hash = currentTab;
    document.getElementById('dashboard').classList.toggle('hidden', currentTab !== 'dashboard');
    document.getElementById('chat').classList.toggle('hidden', currentTab !== 'chat');
    document.getElementById('benchmarks').classList.toggle('hidden', currentTab !== 'benchmarks');
    if (currentTab === 'chat') initChat();
    if (currentTab === 'benchmarks') loadBenchmarks();
  });
});

// ── Dashboard ─────────────────────────────────────────────────────────

async function loadStats() {
  try {
    const r = await fetch('/api/stats');
    const data = await r.json();
    const s = data.last24h;
    const totalSess = s.sessions.reduce((a, b) => a + b.cnt, 0);
    const totalDone = s.sessions.reduce((a, b) => a + b.done, 0);
    const humanReqs = s.requests.find(r => r.fromEntity === 'human');
    document.getElementById('stats').innerHTML = `
      <div class="stat"><div class="label">Sessions (24h)</div><div class="value">${totalSess}</div></div>
      <div class="stat"><div class="label">Success rate</div><div class="value">${totalSess ? Math.round(totalDone/totalSess*100) : 0}%</div></div>
      <div class="stat"><div class="label">Human requests (7d)</div><div class="value">${data.last7d.humanRequests}</div></div>
      <div class="stat"><div class="label">Chat</div><div class="value">${data.socketAvailable ? '✓' : '—'}</div></div>
    `;
  } catch(e) { console.error('Stats error:', e); }
}

async function loadRequests() {
  const from = document.getElementById('f-from').value;
  const status = document.getElementById('f-status').value;
  const params = new URLSearchParams({ limit, offset });
  if (from) params.set('from', from);
  if (status) params.set('status', status);

  try {
    const r = await fetch('/api/requests?' + params);
    const data = await r.json();
    renderRequests(data);
  } catch(e) { console.error('Request load error:', e); }
}

function renderRequests(data) {
  const list = document.getElementById('request-list');
  if (!data.requests.length) {
    list.innerHTML = '<div style="color:var(--fg2);padding:20px;text-align:center">No requests found</div>';
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  list.innerHTML = data.requests.map(r => {
    const date = new Date(r.createdAt).toLocaleString();
    const dur = r.durationMs ? (r.durationMs < 60000 ? Math.round(r.durationMs/1000)+'s' : Math.round(r.durationMs/60000)+'m') : '';
    const outcome = r.outcome || r.summary || '';
    return `<div class="request" data-sid="${r.sessionId || ''}" data-rid="${r.requestId}">
      <div class="top">
        <span class="badge ${r.status}">${r.status}</span>
        ${r.source ? `<span class="badge source">${r.source}</span>` : ''}
        <span class="badge agent">${r.fromEntity} → ${r.toAgent}</span>
        <span style="color:var(--fg2);font-size:12px;margin-left:auto">${date}${dur ? ' · '+dur : ''}</span>
      </div>
      <div class="task">${esc(r.task)}</div>
      ${outcome ? `<div class="outcome">${esc(outcome.slice(0,200))}</div>` : ''}
      <div class="actions" style="margin-top:6px">
        <button class="ask-btn" onclick="event.stopPropagation(); askAboutRequest(${JSON.stringify(r).replace(/"/g, '&quot;')})">💬 Ask about this</button>
      </div>
    </div>`;
  }).join('');

  // Pagination
  const pg = document.getElementById('pagination');
  const hasPrev = offset > 0;
  const hasNext = offset + limit < data.total;
  pg.innerHTML = `
    <button ${hasPrev ? '' : 'disabled'} onclick="offset=Math.max(0,offset-limit);loadRequests()">← Prev</button>
    <span style="color:var(--fg2);font-size:12px;padding:8px">${offset+1}–${Math.min(offset+limit,data.total)} of ${data.total}</span>
    <button ${hasNext ? '' : 'disabled'} onclick="offset+=limit;loadRequests()">Next →</button>
  `;

  // Click handlers
  list.querySelectorAll('.request').forEach(el => {
    el.addEventListener('click', () => {
      const sid = el.dataset.sid;
      if (sid) loadSessionDetail(sid);
    });
  });
}

async function loadSessionDetail(sessionId) {
  const panel = document.getElementById('detail-panel');
  panel.innerHTML = '<div class="panel">Loading...</div>';

  try {
    const [sessRes, transRes] = await Promise.all([
      fetch(`/api/sessions/${sessionId}`),
      fetch(`/api/sessions/${sessionId}/transcript`),
    ]);
    const sessData = await sessRes.json();
    const transData = await transRes.json();

    if (sessData.error) { panel.innerHTML = `<div class="panel">${sessData.error}</div>`; return; }

    const s = sessData.session;
    const dur = s.endedAt ? Math.round((s.endedAt - s.startedAt)/1000) + 's' : 'running';

    let html = `<div class="panel">
      <h3>${s.agent} <span class="badge ${s.status}">${s.status}</span> · ${dur} · ${s.opCount || 0} ops
        <button class="ask-btn" style="margin-left:12px" onclick="askAboutSession('${s.sessionId}', ${JSON.stringify(esc(s.task.slice(0,200))).replace(/'/g,'\\&#39;')})">💬 Ask about this</button>
      </h3>
      <div style="color:var(--fg2);font-size:12px;margin-bottom:8px">${esc(s.task.slice(0,200))}</div>
      ${s.outcome ? `<div style="font-style:italic;color:var(--fg2);font-size:12px;margin-bottom:12px">${esc(s.outcome)}</div>` : ''}`;

    // Children tree
    if (sessData.children.length) {
      html += '<h3 style="margin-top:16px">Delegation Tree</h3>';
      html += renderTree(sessData.children);
    }

    // Transcript
    if (transData.messages && transData.messages.length) {
      html += `<h3 style="margin-top:16px">Transcript (${transData.messageCount} messages)</h3>`;
      html += '<div class="transcript">';
      for (const m of transData.messages) {
        if (m.role === 'user') {
          html += `<div class="msg user">${esc(m.text)}</div>`;
        } else if (m.role === 'assistant') {
          if (m.text) html += `<div class="msg assistant">${esc(m.text)}</div>`;
          if (m.toolCalls) for (const tc of m.toolCalls) {
            html += `<div class="msg tool_call">⚡ ${tc.tool}(${esc(JSON.stringify(tc.args)).slice(0,200)})</div>`;
          }
        } else if (m.role === 'tool_result') {
          html += `<div class="msg tool_result ${m.isError?'error':''}">${esc(m.content.slice(0,500))}</div>`;
        }
      }
      html += '</div>';
    }

    html += '</div>';
    panel.innerHTML = html;
    panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch(e) {
    panel.innerHTML = `<div class="panel">Error loading session: ${e.message}</div>`;
  }
}

function renderTree(children) {
  let html = '';
  // Build a map of parentSessionId -> children
  const byParent = {};
  for (const c of children) {
    const p = c.parentSessionId || 'root';
    if (!byParent[p]) byParent[p] = [];
    byParent[p].push(c);
  }
  function renderLevel(parentId) {
    const kids = byParent[parentId] || [];
    let h = '';
    for (const c of kids) {
      const dur = c.endedAt ? Math.round((c.endedAt - c.startedAt)/1000) + 's' : '...';
      h += `<div class="tree-node">
        <span class="agent">${c.agent}</span> <span class="badge ${c.status}">${c.status}</span> · ${dur}
        <div class="task-preview">${esc(c.task.slice(0,100))}</div>
        ${c.outcome ? `<div class="outcome-preview">${esc(c.outcome.slice(0,150))}</div>` : ''}
        ${renderLevel(c.sessionId)}
      </div>`;
    }
    return h;
  }
  // Find the roots (children of the selected session)
  const rootParents = [...new Set(children.map(c => c.parentSessionId))];
  for (const p of rootParents) {
    html += renderLevel(p);
  }
  return html;
}

// ── Ask about (bridge dashboard → chat) ───────────────────────────────

function switchToChat(message) {
  // Switch to chat tab
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector('[data-tab="chat"]').classList.add('active');
  currentTab = 'chat';
  document.getElementById('dashboard').classList.add('hidden');
  document.getElementById('chat').classList.remove('hidden');
  document.getElementById('benchmarks').classList.add('hidden');
  initChat();

  // Pre-fill the input with the context message
  const input = document.getElementById('chat-input');
  input.value = message;
  input.focus();
}

function askAboutRequest(r) {
  const task = (r.task || '').slice(0, 150);
  const outcome = r.outcome || r.summary || '(no outcome recorded)';
  const dur = r.durationMs ? (r.durationMs < 60000 ? Math.round(r.durationMs/1000)+'s' : Math.round(r.durationMs/60000)+'m') : '?';

  const msg = `Review this request and tell me what happened:\n` +
    `- Request: ${r.requestId.slice(0,8)}\n` +
    `- From: ${r.fromEntity} → ${r.toAgent}\n` +
    `- Task: "${task}"\n` +
    `- Status: ${r.status}, duration: ${dur}\n` +
    (r.sessionId ? `- Session: ${r.sessionId}\n` : '') +
    `- Outcome: ${outcome.slice(0,200)}\n\n` +
    `Was this handled well? What was the actual result?`;

  switchToChat(msg);
}

function askAboutSession(sessionId, taskPreview) {
  const msg = `Review session ${sessionId} and tell me what happened.\n` +
    `Task: "${taskPreview}"\n\n` +
    `Read the session transcript at .state/sessions/history/${sessionId}/session.jsonl and summarize: what did the agent do, was it done well, any issues?`;

  switchToChat(msg);
}

// ── Chat ──────────────────────────────────────────────────────────────

let ws = null;
let chatInitialized = false;
let activeSessions = [];
let currentSessionId = null;
let renderMd = true; // markdown rendering on by default

function initChat() {
  if (chatInitialized) return;
  chatInitialized = true;
  connectWs();
}

function toggleMarkdown() {
  renderMd = !renderMd;
  document.getElementById('md-toggle').textContent = renderMd ? 'Raw' : 'Markdown';
  document.querySelectorAll('.msg.assistant').forEach(el => {
    const raw = el.dataset.raw;
    if (!raw) return;
    if (renderMd && window.marked && window.marked.parse) {
      el.innerHTML = window.marked.parse(raw);
      el.classList.add('md-rendered');
    } else {
      el.textContent = raw;
      el.classList.remove('md-rendered');
    }
  });
}

function renderAssistantMsg(el, text) {
  el.dataset.raw = text;
  if (renderMd && window.marked && window.marked.parse) {
    el.innerHTML = window.marked.parse(text);
    el.classList.add('md-rendered');
  } else {
    el.textContent = text;
    el.classList.remove('md-rendered');
  }
}

function renderSessionPicker() {
  const picker = document.getElementById('session-picker');
  if (!picker) return;
  const seen = new Set();
  // Show running AND idle chat sessions (idle = waiting for next message)
  const visible = activeSessions.filter(s => {
    if (seen.has(s.sessionId)) return false;
    if (s.status !== 'running' && !(s.status === 'idle' && s.kind === 'chat')) return false;
    seen.add(s.sessionId);
    return true;
  });
  let html = '<button class="ask-btn" style="' + (!currentSessionId ? 'border-color:var(--accent);color:var(--accent)' : '') + '" onclick="switchSession(null)">💬 Chat</button> ';
  for (const s of visible) {
    const isActive = currentSessionId === s.sessionId;
    const color = isActive ? 'border-color:var(--accent);color:var(--accent)' : '';
    const label = s.agent + ' (' + s.sessionId.slice(-6) + ')';
    const task = (s.task || '').slice(0, 80);
    const statusIcon = s.status === 'idle' ? '💤 ' : '';
    html += `<button class="ask-btn" style="${color}" onclick="switchSession('${s.sessionId}')" title="${esc(task)}">${statusIcon}${label}</button> `;
  }
  if (visible.length === 0) {
    html += '<span style="color:var(--fg2);font-size:11px">No active sessions</span>';
  }
  picker.innerHTML = html;
  const target = visible.find(s => s.sessionId === currentSessionId);
  document.getElementById('chat-input').placeholder = currentSessionId
    ? `Steer ${target?.agent || 'session'}...`
    : 'Type a message...';
}

async function switchSession(sessionId) {
  currentSessionId = sessionId;
  const messages = document.getElementById('chat-messages');
  messages.innerHTML = '';

  if (sessionId) {
    // Load transcript history
    try {
      const resp = await fetch(`/api/sessions/${sessionId}/transcript`);
      if (resp.ok) {
        const data = await resp.json();
        const transcript = data.messages || data;
        for (const msg of transcript) {
          if (msg.role === 'user' && msg.text) {
            const div = document.createElement('div');
            div.className = 'msg user';
            div.textContent = msg.text;
            messages.appendChild(div);
          } else if (msg.role === 'assistant' && msg.text) {
            const div = document.createElement('div');
            div.className = 'msg assistant';
            renderAssistantMsg(div, msg.text);
            messages.appendChild(div);
          } else if (msg.role === 'tool_result' && msg.isError) {
            const div = document.createElement('div');
            div.className = 'msg tool_result error';
            div.textContent = (msg.content || '').slice(0, 200);
            messages.appendChild(div);
          }
        }
      }
    } catch {}
    messages.scrollTop = messages.scrollHeight;
  }

  renderSessionPicker();
  // Tell the server to switch subscription
  if (ws && ws.readyState === 1) {
    if (sessionId) {
      ws.send(JSON.stringify({ type: 'subscribe', sessions: [sessionId] }));
    } else {
      // Chat mode — subscribe to "*" to get the next session_start
      ws.send(JSON.stringify({ type: 'subscribe', sessions: ['*'] }));
    }
  }
}

function connectWs() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws`);
  const status = document.getElementById('chat-status');
  const messages = document.getElementById('chat-messages');

  ws.onopen = () => {
    status.textContent = 'Connected';
    // Poll for active sessions periodically
    const pollSessions = () => {
      if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'status' }));
    };
    pollSessions();
    setInterval(pollSessions, 15000);
  };
  ws.onclose = () => {
    status.textContent = 'Disconnected — reconnecting...';
    setTimeout(connectWs, 3000);
  };
  ws.onerror = () => { status.textContent = 'Connection error'; };

  let currentAssistant = null;
  let currentAssistantRaw = ''; // accumulate raw text for markdown rendering

  ws.onmessage = (e) => {
    try {
      const event = JSON.parse(e.data);

      // The socket server filters events via subscribe — we receive only
      // events from our session tree + notifications. No client-side filtering needed.

      switch (event.type) {
        case 'text':
          if (!currentAssistant) {
            currentAssistant = document.createElement('div');
            currentAssistant.className = 'msg assistant';
            currentAssistantRaw = '';
            messages.appendChild(currentAssistant);
          }
          currentAssistantRaw += event.text;
          renderAssistantMsg(currentAssistant, currentAssistantRaw);
          messages.scrollTop = messages.scrollHeight;
          break;
        case 'tool_call': {
          currentAssistant = null;
          currentAssistantRaw = '';
          const div = document.createElement('div');
          div.className = 'msg tool_call';
          const argsStr = typeof event.args === 'string' ? event.args : JSON.stringify(event.args);
          div.textContent = `⚡ ${event.tool}(${argsStr.slice(0, 200)})`;
          messages.appendChild(div);
          messages.scrollTop = messages.scrollHeight;
          break;
        }
        case 'tool_result': {
          const div = document.createElement('div');
          div.className = `msg tool_result ${event.isError ? 'error' : ''}`;
          div.textContent = event.preview || '';
          messages.appendChild(div);
          messages.scrollTop = messages.scrollHeight;
          break;
        }
        case 'turn_end':
          currentAssistant = null;
          currentAssistantRaw = '';
          break;
        case 'session_start': {
          // Show delegation: "→ tech-lead: <task>"
          if (event.parentSessionId) {
            const div = document.createElement('div');
            div.className = 'msg';
            div.style.color = 'var(--purple)';
            div.style.fontSize = '12px';
            div.textContent = `→ ${event.agent}: ${(event.task || '').slice(0, 100)}`;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
          }
          break;
        }
        case 'session_end': {
          const div = document.createElement('div');
          div.className = 'msg';
          div.style.color = 'var(--fg2)';
          div.style.fontSize = '12px';
          div.textContent = `✓ ${event.agent}: ${event.status}${event.duration ? ' (' + event.duration + ')' : ''}`;
          messages.appendChild(div);
          messages.scrollTop = messages.scrollHeight;
          break;
        }
        case 'notification': {
          const div = document.createElement('div');
          div.className = 'msg';
          div.style.borderLeft = '3px solid var(--yellow)';
          div.style.paddingLeft = '8px';
          div.style.fontSize = '12px';
          div.textContent = `📋 ${event.agent}: ${event.text.slice(0, 300)}`;
          messages.appendChild(div);
          messages.scrollTop = messages.scrollHeight;
          break;
        }
        case 'connected':
          status.textContent = `Connected — ${event.agent} (${event.instance})`;
          activeSessions = event.activeAgents || [];
          renderSessionPicker();
          // Auto-attach to existing chat session (preserves conversation across refreshes)
          if (!currentSessionId) {
            const chatSession = activeSessions.find(s => s.agent === 'may' && (s.status === 'running' || (s.status === 'idle' && s.kind === 'chat')));
            if (chatSession) {
              switchSession(chatSession.sessionId);
            }
          }
          break;
        case 'session_start':
          // New session appeared — update picker
          if (event.sessionId && !activeSessions.find(s => s.sessionId === event.sessionId)) {
            activeSessions.push({ agent: event.agent, sessionId: event.sessionId, status: 'running', task: event.task });
            renderSessionPicker();
          }
          // If in chat mode and this looks like our session, subscribe to it
          if (!currentSessionId && event.agent === 'may') {
            currentSessionId = event.sessionId;
            ws.send(JSON.stringify({ type: 'subscribe', sessions: [event.sessionId] }));
            renderSessionPicker();
          }
          break;
        case 'session_end':
          activeSessions = activeSessions.filter(s => s.sessionId !== event.sessionId);
          renderSessionPicker();
          break;
      }
    } catch {}
  };
}

function sendChat() {
  const input = document.getElementById('chat-input');
  const msg = input.value.trim();
  if (!msg || !ws || ws.readyState !== 1) return;

  // Show user message
  const messages = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'msg user';
  div.textContent = msg;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;

  if (currentSessionId) {
    // Steer the selected session
    ws.send(JSON.stringify({ type: 'steer', sessionId: currentSessionId, message: msg }));
  } else {
    // Chat mode — input to the interface agent
    ws.send(JSON.stringify({ type: 'input', message: msg }));
  }
  input.value = '';
}

document.getElementById('chat-send').addEventListener('click', sendChat);
document.getElementById('chat-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
});

document.getElementById('f-from').addEventListener('change', () => { offset=0; loadRequests(); });
document.getElementById('f-status').addEventListener('change', () => { offset=0; loadRequests(); });
let searchTimer;
document.getElementById('f-search').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { offset=0; loadRequests(); }, 300);
});

// ── Helpers ───────────────────────────────────────────────────────────
function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Benchmarks ────────────────────────────────────────────────────────

let benchmarkAgent = null;
let compareA = null, compareB = null;

async function loadBenchmarks(agent) {
  benchmarkAgent = agent || null;
  const panel = document.getElementById('benchmark-content');
  try {
    const params = agent ? '?agent=' + agent : '';
    const r = await fetch('/api/benchmarks' + params);
    const data = await r.json();

    if (data.runs === 0) {
      panel.innerHTML = '<div style="color:var(--fg2);padding:20px;text-align:center">No benchmark data yet. Run: <code>scripts/gym-baseline.sh --tier smoke --agent coder</code></div>';
      return;
    }

    let html = '';

    // Agent selector
    const agents = Object.keys(data.agents).sort();
    html += '<div style="margin-bottom:16px">';
    html += '<span style="color:var(--fg2);font-size:13px;margin-right:8px">Agent:</span>';
    html += `<button class="ask-btn" onclick="loadBenchmarks()" style="${!agent ? 'border-color:var(--accent);color:var(--accent)' : ''}">All</button> `;
    for (const a of agents) {
      html += `<button class="ask-btn" onclick="loadBenchmarks('${a}')" style="${agent === a ? 'border-color:var(--accent);color:var(--accent)' : ''}">${a}</button> `;
    }
    html += `<span style="color:var(--fg2);font-size:12px;margin-left:12px">${data.runs} total runs</span>`;
    html += '</div>';

    // Batch timeline (if batches exist)
    if (data.batches && data.batches.length > 0) {
      html += '<div class="panel" style="margin-bottom:16px"><h3 style="font-size:14px;margin-bottom:8px">Batches</h3>';
      html += '<table style="width:100%;border-collapse:collapse;font-size:12px">';
      html += '<tr><th style="text-align:left;padding:4px 8px;border-bottom:1px solid var(--border)">Date</th>';
      html += '<th style="text-align:left;padding:4px 8px;border-bottom:1px solid var(--border)">Tag</th>';
      html += '<th style="padding:4px 8px;border-bottom:1px solid var(--border)">Agent</th>';
      html += '<th style="padding:4px 8px;border-bottom:1px solid var(--border)">Prompt</th>';
      html += '<th style="padding:4px 8px;border-bottom:1px solid var(--border)">Model</th>';
      html += '<th style="padding:4px 8px;border-bottom:1px solid var(--border)">Result</th>';
      html += '<th style="padding:4px 8px;border-bottom:1px solid var(--border)">Compare</th></tr>';

      for (const b of data.batches) {
        const pct = b.total > 0 ? Math.round(b.passed / b.total * 100) : 0;
        const color = pct >= 80 ? 'var(--green)' : pct >= 50 ? 'var(--yellow)' : 'var(--red)';
        const barW = Math.round(pct * 0.6);
        const date = b.started_at ? b.started_at.split('T')[0] : '—';
        const tag = b.run_tag ? esc(b.run_tag) : '<span style="color:var(--fg2)">—</span>';
        const prompt = b.prompt_hash ? b.prompt_hash.slice(0,8) : '—';
        html += `<tr>`;
        html += `<td style="padding:4px 8px;border-bottom:1px solid var(--border)">${date}</td>`;
        html += `<td style="padding:4px 8px;border-bottom:1px solid var(--border)">${tag}</td>`;
        html += `<td style="padding:4px 8px;border-bottom:1px solid var(--border);text-align:center">${b.agent_name}</td>`;
        html += `<td style="padding:4px 8px;border-bottom:1px solid var(--border);text-align:center;font-family:var(--mono);font-size:11px"><a href="javascript:void(0)" onclick="showPrompt('${prompt}')">${prompt}</a></td>`;
        html += `<td style="padding:4px 8px;border-bottom:1px solid var(--border);text-align:center">${b.model || '—'}</td>`;
        html += `<td style="padding:4px 8px;border-bottom:1px solid var(--border);text-align:center;color:${color}"><span style="display:inline-block;width:${barW}px;height:10px;background:${color};border-radius:2px;margin-right:4px"></span>${b.passed}/${b.total} (${pct}%)</td>`;
        html += `<td style="padding:4px 8px;border-bottom:1px solid var(--border);text-align:center"><input type="checkbox" onchange="toggleCompare('${b.batch_id}', this.checked)" ${compareA === b.batch_id || compareB === b.batch_id ? 'checked' : ''}></td>`;
        html += `</tr>`;
      }
      html += '</table>';
      html += '<div id="compare-bar" style="margin-top:8px"></div>';
      html += '</div>';
    }

    // Category summary (when agent is selected)
    if (agent && data.agents[agent]) {
      const scenarios = data.agents[agent];
      const byCat = {};
      for (const s of scenarios) {
        const cats = s.categories && s.categories.length > 0 ? s.categories : ['uncategorized'];
        for (const c of cats) {
          if (!byCat[c]) byCat[c] = { total: 0, passed: 0 };
          byCat[c].total++;
          if (s.passRate >= 1) byCat[c].passed++;
        }
      }

      const sortedCats = Object.entries(byCat).sort((a,b) => (a[1].passed/a[1].total) - (b[1].passed/b[1].total));
      if (sortedCats.length > 0) {
        html += '<div class="panel" style="margin-bottom:16px"><h3 style="font-size:14px;margin-bottom:8px">Agent Profile</h3>';
        for (const [cat, v] of sortedCats) {
          const pct = v.total > 0 ? Math.round(v.passed / v.total * 100) : 0;
          const color = pct >= 80 ? 'var(--green)' : pct >= 50 ? 'var(--yellow)' : 'var(--red)';
          const barW = Math.round(pct * 1.5);
          html += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:12px">`;
          html += `<span style="width:180px;color:var(--fg2)">${cat}</span>`;
          html += `<span style="display:inline-block;width:${barW}px;height:12px;background:${color};border-radius:2px"></span>`;
          html += `<span style="color:${color}">${v.passed}/${v.total} (${pct}%)</span>`;
          html += `</div>`;
        }
        html += '</div>';
      }
    }

    // Scenario table per agent (with category grouping when agent selected)
    for (const [agentName, scenarios] of Object.entries(data.agents)) {
      const totalPass = scenarios.filter(s => s.passRate >= 1).length;

      html += `<div class="panel" style="margin-bottom:12px">`;
      html += `<h3 style="font-size:14px;margin-bottom:8px">${agentName} <span style="color:var(--fg2);font-size:12px">${totalPass}/${scenarios.length} passing</span></h3>`;

      // Group by first category if agent is selected
      let groups = { 'all': scenarios };
      if (agent) {
        groups = {};
        for (const s of scenarios) {
          const cat = s.categories && s.categories.length > 0 ? s.categories[0] : 'uncategorized';
          if (!groups[cat]) groups[cat] = [];
          groups[cat].push(s);
        }
      }

      for (const [groupName, groupScenarios] of Object.entries(groups)) {
        if (agent && groupName !== 'all') {
          const gPass = groupScenarios.filter(s => s.passRate >= 1).length;
          html += `<div style="font-size:12px;color:var(--fg2);margin:8px 0 4px;font-weight:600">${groupName} (${gPass}/${groupScenarios.length})</div>`;
        }
        html += '<table style="width:100%;border-collapse:collapse;font-size:12px">';
        for (const s of groupScenarios) {
          const pct = Math.round(s.passRate * 100);
          const color = pct >= 100 ? 'var(--green)' : pct >= 50 ? 'var(--yellow)' : 'var(--red)';
          const avgTime = s.avgMs ? (s.avgMs < 60000 ? Math.round(s.avgMs/1000) + 's' : Math.round(s.avgMs/60000) + 'm') : '—';
          html += `<tr><td style="padding:2px 8px;border-bottom:1px solid var(--border)">${s.scenario}</td>`;
          html += `<td style="padding:2px 8px;border-bottom:1px solid var(--border);text-align:center;color:${color};width:80px">${pct}% (${s.passes}/${s.runs})</td>`;
          html += `<td style="padding:2px 8px;border-bottom:1px solid var(--border);text-align:center;width:60px;color:var(--fg2)">${avgTime}</td></tr>`;
          const checks = data.checkDetails?.[s.scenario];
          if (checks && checks.length > 0) {
            html += '<tr><td colspan="3" style="padding:1px 8px 4px 24px;border-bottom:1px solid var(--border)">';
            for (const c of checks) { html += `<span style="margin-right:8px;font-size:11px">${c.passed ? '✅' : '❌'} ${c.check_name}</span>`; }
            html += '</td></tr>';
          }
        }
        html += '</table>';
      }
      html += '</div>';
    }

    panel.innerHTML = html;
    updateCompareBar();
  } catch(e) {
    panel.innerHTML = `<div style="color:var(--red);padding:20px">Error loading benchmarks: ${e.message}</div>`;
  }
}

function toggleCompare(batchId, checked) {
  if (checked) {
    if (!compareA) compareA = batchId;
    else if (!compareB) compareB = batchId;
    else { compareA = compareB; compareB = batchId; }
  } else {
    if (compareA === batchId) compareA = null;
    if (compareB === batchId) compareB = null;
  }
  updateCompareBar();
}

function updateCompareBar() {
  const bar = document.getElementById('compare-bar');
  if (!bar) return;
  if (compareA && compareB) {
    bar.innerHTML = `<button class="ask-btn" style="border-color:var(--accent);color:var(--accent)" onclick="showComparison()">Compare ${compareA.slice(0,8)} vs ${compareB.slice(0,8)}</button> <button class="ask-btn" onclick="compareA=null;compareB=null;loadBenchmarks(benchmarkAgent)">Clear</button>`;
  } else if (compareA || compareB) {
    bar.innerHTML = `<span style="color:var(--fg2);font-size:12px">Select one more batch to compare</span>`;
  } else {
    bar.innerHTML = '';
  }
}

async function showComparison() {
  if (!compareA || !compareB) return;
  const panel = document.getElementById('benchmark-content');
  try {
    const r = await fetch(`/api/benchmarks/compare?a=${compareA}&b=${compareB}`);
    const data = await r.json();
    if (data.error) { panel.innerHTML = `<div style="color:var(--red)">${data.error}</div>`; return; }

    let html = `<button class="ask-btn" onclick="loadBenchmarks(benchmarkAgent)" style="margin-bottom:12px">← Back</button>`;
    html += `<h3 style="font-size:14px;margin-bottom:12px">Comparison: ${compareA.slice(0,8)} vs ${compareB.slice(0,8)}</h3>`;

    if (data.regressions.length > 0) {
      html += `<div class="panel" style="margin-bottom:8px;border-left:3px solid var(--red)"><h3 style="font-size:13px;color:var(--red);margin-bottom:6px">Regressions (${data.regressions.length})</h3>`;
      for (const r of data.regressions) html += `<div style="font-size:12px;padding:2px 0">✅ → ❌ ${r.scenario}</div>`;
      html += '</div>';
    }
    if (data.improvements.length > 0) {
      html += `<div class="panel" style="margin-bottom:8px;border-left:3px solid var(--green)"><h3 style="font-size:13px;color:var(--green);margin-bottom:6px">Improvements (${data.improvements.length})</h3>`;
      for (const r of data.improvements) html += `<div style="font-size:12px;padding:2px 0">❌ → ✅ ${r.scenario}</div>`;
      html += '</div>';
    }
    if (data.unchanged.length > 0) {
      html += `<div class="panel" style="margin-bottom:8px"><h3 style="font-size:13px;color:var(--fg2);margin-bottom:6px;cursor:pointer" onclick="this.nextElementSibling.classList.toggle('hidden')">Unchanged (${data.unchanged.length}) ▸</h3><div class="hidden">`;
      for (const r of data.unchanged) { const icon = r.b === true ? '✅' : r.b === false ? '❌' : '—'; html += `<div style="font-size:12px;padding:1px 0">${icon} ${r.scenario}</div>`; }
      html += '</div></div>';
    }

    // Prompt diff link
    if (data.promptHashA && data.promptHashB && data.promptHashA !== data.promptHashB) {
      html += `<button class="ask-btn" onclick="showPromptDiff('${data.promptHashA}','${data.promptHashB}')" style="margin-top:8px">Show Prompt Diff</button>`;
      html += `<div id="prompt-diff-panel"></div>`;
    }

    panel.innerHTML = html;
  } catch(e) { panel.innerHTML = `<div style="color:var(--red)">Error: ${e.message}</div>`; }
}

async function showPrompt(hash) {
  if (!hash || hash === '—') return;
  try {
    const r = await fetch(`/api/benchmarks/prompts?hash=${hash}`);
    const data = await r.json();
    if (data.error) { alert(data.error); return; }
    const win = window.open('', '_blank', 'width=800,height=600');
    win.document.write(`<pre style="font-family:monospace;white-space:pre-wrap;padding:16px;background:#0d1117;color:#c9d1d9">${esc(data.prompt_text)}</pre>`);
  } catch(e) { alert(e.message); }
}

async function showPromptDiff(hashA, hashB) {
  const panel = document.getElementById('prompt-diff-panel');
  if (!panel) return;
  try {
    const r = await fetch(`/api/benchmarks/prompts?hash=${hashA}&diff=${hashB}`);
    const data = await r.json();
    if (data.error) { panel.innerHTML = `<div style="color:var(--red)">${data.error}</div>`; return; }

    // Simple line-by-line diff
    const linesA = data.a.text.split('\n');
    const linesB = data.b.text.split('\n');
    let diffHtml = '<div style="font-family:var(--mono);font-size:11px;max-height:400px;overflow-y:auto;margin-top:8px;border:1px solid var(--border);border-radius:6px;padding:8px">';
    const maxLines = Math.max(linesA.length, linesB.length);
    for (let i = 0; i < maxLines; i++) {
      const a = linesA[i] || '';
      const b = linesB[i] || '';
      if (a === b) {
        diffHtml += `<div style="color:var(--fg2)">${esc(a)}</div>`;
      } else {
        if (a) diffHtml += `<div style="color:var(--red);background:rgba(248,81,73,0.1)">- ${esc(a)}</div>`;
        if (b) diffHtml += `<div style="color:var(--green);background:rgba(63,185,80,0.1)">+ ${esc(b)}</div>`;
      }
    }
    diffHtml += '</div>';
    panel.innerHTML = diffHtml;
  } catch(e) { panel.innerHTML = `<div style="color:var(--red)">Error: ${e.message}</div>`; }
}

// ── Digest ────────────────────────────────────────────────────────────

async function loadDigest(date) {
  const panel = document.getElementById('digest-panel');
  try {
    const params = date ? '?date=' + date : '';
    const r = await fetch('/api/digest' + params);
    const data = await r.json();
    if (!data.digest) {
      panel.innerHTML = '<div style="color:var(--fg2);font-size:13px;padding:8px">No digest yet — generated daily by the system.</div>';
      return;
    }

    // Date navigation
    const available = data.available || [];
    const currentIdx = available.indexOf(data.date);
    const prevDate = currentIdx < available.length - 1 ? available[currentIdx + 1] : null;
    const nextDate = currentIdx > 0 ? available[currentIdx - 1] : null;

    let nav = '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">';
    nav += prevDate ? `<button class="ask-btn" onclick="loadDigest('${prevDate}')">← ${prevDate}</button>` : '<span></span>';
    nav += `<span style="color:var(--fg2);font-size:12px;flex:1;text-align:center">${data.date} (${available.length} days available)</span>`;
    nav += nextDate ? `<button class="ask-btn" onclick="loadDigest('${nextDate}')">${nextDate} →</button>` : '<span></span>';
    nav += '</div>';

    // Simple markdown → HTML
    let html = data.digest
      .replace(/^# (.+)$/gm, '<h2 style="font-size:16px;margin:16px 0 8px">$1</h2>')
      .replace(/^## (.+)$/gm, '<h3 style="font-size:14px;color:var(--accent);margin:14px 0 6px">$1</h3>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/^- (.+)$/gm, '<div style="padding-left:12px">• $1</div>')
      .replace(/^(\|.+\|)$/gm, (row) => {
        if (row.match(/^\|[-|]+\|$/)) return '';
        const cells = row.split('|').filter(Boolean).map(c => c.trim());
        const tag = row === row.toUpperCase() ? 'th' : 'td';
        return '<tr>' + cells.map(c => `<${tag} style="padding:4px 8px;border-bottom:1px solid var(--border);font-size:12px">${c}</${tag}>`).join('') + '</tr>';
      })
      .replace(/(<tr>.*<\/tr>\n?)+/g, (m) => `<table style="width:100%;border-collapse:collapse;margin:8px 0">${m}</table>`)
      .replace(/\n\n/g, '<br>');

    panel.innerHTML = `<div class="panel" style="border-left:3px solid var(--accent)">${nav}${html}</div>`;
  } catch(e) {
    panel.innerHTML = '';
  }
}

// ── Init ──────────────────────────────────────────────────────────────

// Restore tab from URL hash
if (currentTab !== 'dashboard') {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === currentTab));
  document.getElementById('dashboard').classList.toggle('hidden', currentTab !== 'dashboard');
  document.getElementById('chat').classList.toggle('hidden', currentTab !== 'chat');
  document.getElementById('benchmarks').classList.toggle('hidden', currentTab !== 'benchmarks');
  if (currentTab === 'chat') initChat();
  if (currentTab === 'benchmarks') loadBenchmarks();
}

loadDigest();
loadStats();
loadRequests();
