function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Benchmarks ────────────────────────────────────────────────────────

let benchmarkAgent = null;
let compareA = null, compareB = null;

async function loadBenchmarks(agent) {
  benchmarkAgent = agent || null;
  const panel = document.getElementById('benchmark-content');
  try {
    const params = agent ? '?agent=' + agent : '';
    const r = await fetch('/api/benchmarks' + params);
    const data = await r.json();

    if (data.runs === 0) {
      panel.innerHTML = '<div style="color:var(--fg2);padding:20px;text-align:center">No benchmark data yet. Run: <code>scripts/gym-baseline.sh --tier smoke --agent coder</code></div>';
      return;
    }

    let html = '';

    // Agent selector
    const agents = Object.keys(data.agents).sort();
    html += '<div style="margin-bottom:16px">';
    html += '<span style="color:var(--fg2);font-size:13px;margin-right:8px">Agent:</span>';
    html += `<button class="ask-btn" onclick="loadBenchmarks()" style="${!agent ? 'border-color:var(--accent);color:var(--accent)' : ''}">All</button> `;
    for (const a of agents) {
      html += `<button class="ask-btn" onclick="loadBenchmarks('${a}')" style="${agent === a ? 'border-color:var(--accent);color:var(--accent)' : ''}">${a}</button> `;
    }
    html += `<span style="color:var(--fg2);font-size:12px;margin-left:12px">${data.runs} total runs</span>`;
    html += '</div>';

    // Batch timeline (if batches exist)
    if (data.batches && data.batches.length > 0) {
      html += '<div class="panel" style="margin-bottom:16px"><h3 style="font-size:14px;margin-bottom:8px">Batches</h3>';
      html += '<table style="width:100%;border-collapse:collapse;font-size:12px">';
      html += '<tr><th style="text-align:left;padding:4px 8px;border-bottom:1px solid var(--border)">Date</th>';
      html += '<th style="text-align:left;padding:4px 8px;border-bottom:1px solid var(--border)">Tag</th>';
      html += '<th style="padding:4px 8px;border-bottom:1px solid var(--border)">Agent</th>';
      html += '<th style="padding:4px 8px;border-bottom:1px solid var(--border)">Prompt</th>';
      html += '<th style="padding:4px 8px;border-bottom:1px solid var(--border)">Model</th>';
      html += '<th style="padding:4px 8px;border-bottom:1px solid var(--border)">Result</th>';
      html += '<th style="padding:4px 8px;border-bottom:1px solid var(--border)">Compare</th></tr>';

      for (const b of data.batches) {
        const pct = b.total > 0 ? Math.round(b.passed / b.total * 100) : 0;
        const color = pct >= 80 ? 'var(--green)' : pct >= 50 ? 'var(--yellow)' : 'var(--red)';
        const barW = Math.round(pct * 0.6);
        const date = b.started_at ? b.started_at.split('T')[0] : '—';
        const tag = b.run_tag ? esc(b.run_tag) : '<span style="color:var(--fg2)">—</span>';
        const prompt = b.prompt_hash ? b.prompt_hash.slice(0,8) : '—';
        html += `<tr>`;
        html += `<td style="padding:4px 8px;border-bottom:1px solid var(--border)">${date}</td>`;
        html += `<td style="padding:4px 8px;border-bottom:1px solid var(--border)">${tag}</td>`;
        html += `<td style="padding:4px 8px;border-bottom:1px solid var(--border);text-align:center">${b.agent_name}</td>`;
        html += `<td style="padding:4px 8px;border-bottom:1px solid var(--border);text-align:center;font-family:var(--mono);font-size:11px"><a href="javascript:void(0)" onclick="showPrompt('${prompt}')">${prompt}</a></td>`;
        html += `<td style="padding:4px 8px;border-bottom:1px solid var(--border);text-align:center">${b.model || '—'}</td>`;
        html += `<td style="padding:4px 8px;border-bottom:1px solid var(--border);text-align:center;color:${color}"><span style="display:inline-block;width:${barW}px;height:10px;background:${color};border-radius:2px;margin-right:4px"></span>${b.passed}/${b.total} (${pct}%)</td>`;
        html += `<td style="padding:4px 8px;border-bottom:1px solid var(--border);text-align:center"><input type="checkbox" onchange="toggleCompare('${b.batch_id}', this.checked)" ${compareA === b.batch_id || compareB === b.batch_id ? 'checked' : ''}></td>`;
        html += `</tr>`;
      }
      html += '</table>';
      html += '<div id="compare-bar" style="margin-top:8px"></div>';
      html += '</div>';
    }

    // Category summary (when agent is selected)
    if (agent && data.agents[agent]) {
      const scenarios = data.agents[agent];
      const byCat = {};
      for (const s of scenarios) {
        const cats = s.categories && s.categories.length > 0 ? s.categories : ['uncategorized'];
        for (const c of cats) {
          if (!byCat[c]) byCat[c] = { total: 0, passed: 0 };
          byCat[c].total++;
          if (s.passRate >= 1) byCat[c].passed++;
        }
      }

      const sortedCats = Object.entries(byCat).sort((a,b) => (a[1].passed/a[1].total) - (b[1].passed/b[1].total));
      if (sortedCats.length > 0) {
        html += '<div class="panel" style="margin-bottom:16px"><h3 style="font-size:14px;margin-bottom:8px">Agent Profile</h3>';
        for (const [cat, v] of sortedCats) {
          const pct = v.total > 0 ? Math.round(v.passed / v.total * 100) : 0;
          const color = pct >= 80 ? 'var(--green)' : pct >= 50 ? 'var(--yellow)' : 'var(--red)';
          const barW = Math.round(pct * 1.5);
          html += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:12px">`;
          html += `<span style="width:180px;color:var(--fg2)">${cat}</span>`;
          html += `<span style="display:inline-block;width:${barW}px;height:12px;background:${color};border-radius:2px"></span>`;
          html += `<span style="color:${color}">${v.passed}/${v.total} (${pct}%)</span>`;
          html += `</div>`;
        }
        html += '</div>';
      }
    }

    // Scenario table per agent (with category grouping when agent selected)
    for (const [agentName, scenarios] of Object.entries(data.agents)) {
      const totalPass = scenarios.filter(s => s.passRate >= 1).length;

      html += `<div class="panel" style="margin-bottom:12px">`;
      html += `<h3 style="font-size:14px;margin-bottom:8px">${agentName} <span style="color:var(--fg2);font-size:12px">${totalPass}/${scenarios.length} passing</span></h3>`;

      // Group by first category if agent is selected
      let groups = { 'all': scenarios };
      if (agent) {
        groups = {};
        for (const s of scenarios) {
          const cat = s.categories && s.categories.length > 0 ? s.categories[0] : 'uncategorized';
          if (!groups[cat]) groups[cat] = [];
          groups[cat].push(s);
        }
      }

      for (const [groupName, groupScenarios] of Object.entries(groups)) {
        if (agent && groupName !== 'all') {
          const gPass = groupScenarios.filter(s => s.passRate >= 1).length;
          html += `<div style="font-size:12px;color:var(--fg2);margin:8px 0 4px;font-weight:600">${groupName} (${gPass}/${groupScenarios.length})</div>`;
        }
        html += '<table style="width:100%;border-collapse:collapse;font-size:12px">';
        for (const s of groupScenarios) {
          const pct = Math.round(s.passRate * 100);
          const color = pct >= 100 ? 'var(--green)' : pct >= 50 ? 'var(--yellow)' : 'var(--red)';
          const avgTime = s.avgMs ? (s.avgMs < 60000 ? Math.round(s.avgMs/1000) + 's' : Math.round(s.avgMs/60000) + 'm') : '—';
          html += `<tr><td style="padding:2px 8px;border-bottom:1px solid var(--border)">${s.scenario}</td>`;
          html += `<td style="padding:2px 8px;border-bottom:1px solid var(--border);text-align:center;color:${color};width:80px">${pct}% (${s.passes}/${s.runs})</td>`;
          html += `<td style="padding:2px 8px;border-bottom:1px solid var(--border);text-align:center;width:60px;color:var(--fg2)">${avgTime}</td></tr>`;
          const checks = data.checkDetails?.[s.scenario];
          if (checks && checks.length > 0) {
            html += '<tr><td colspan="3" style="padding:1px 8px 4px 24px;border-bottom:1px solid var(--border)">';
            for (const c of checks) { html += `<span style="margin-right:8px;font-size:11px">${c.passed ? '✅' : '❌'} ${c.check_name}</span>`; }
            html += '</td></tr>';
          }
        }
        html += '</table>';
      }
      html += '</div>';
    }

    panel.innerHTML = html;
    updateCompareBar();
  } catch(e) {
    panel.innerHTML = `<div style="color:var(--red);padding:20px">Error loading benchmarks: ${e.message}</div>`;
  }
}

function toggleCompare(batchId, checked) {
  if (checked) {
    if (!compareA) compareA = batchId;
    else if (!compareB) compareB = batchId;
    else { compareA = compareB; compareB = batchId; }
  } else {
    if (compareA === batchId) compareA = null;
    if (compareB === batchId) compareB = null;
  }
  updateCompareBar();
}

function updateCompareBar() {
  const bar = document.getElementById('compare-bar');
  if (!bar) return;
  if (compareA && compareB) {
    bar.innerHTML = `<button class="ask-btn" style="border-color:var(--accent);color:var(--accent)" onclick="showComparison()">Compare ${compareA.slice(0,8)} vs ${compareB.slice(0,8)}</button> <button class="ask-btn" onclick="compareA=null;compareB=null;loadBenchmarks(benchmarkAgent)">Clear</button>`;
  } else if (compareA || compareB) {
    bar.innerHTML = `<span style="color:var(--fg2);font-size:12px">Select one more batch to compare</span>`;
  } else {
    bar.innerHTML = '';
  }
}

async function showComparison() {
  if (!compareA || !compareB) return;
  const panel = document.getElementById('benchmark-content');
  try {
    const r = await fetch(`/api/benchmarks/compare?a=${compareA}&b=${compareB}`);
    const data = await r.json();
    if (data.error) { panel.innerHTML = `<div style="color:var(--red)">${data.error}</div>`; return; }

    let html = `<button class="ask-btn" onclick="loadBenchmarks(benchmarkAgent)" style="margin-bottom:12px">← Back</button>`;
    html += `<h3 style="font-size:14px;margin-bottom:12px">Comparison: ${compareA.slice(0,8)} vs ${compareB.slice(0,8)}</h3>`;

    if (data.regressions.length > 0) {
      html += `<div class="panel" style="margin-bottom:8px;border-left:3px solid var(--red)"><h3 style="font-size:13px;color:var(--red);margin-bottom:6px">Regressions (${data.regressions.length})</h3>`;
      for (const r of data.regressions) html += `<div style="font-size:12px;padding:2px 0">✅ → ❌ ${r.scenario}</div>`;
      html += '</div>';
    }
    if (data.improvements.length > 0) {
      html += `<div class="panel" style="margin-bottom:8px;border-left:3px solid var(--green)"><h3 style="font-size:13px;color:var(--green);margin-bottom:6px">Improvements (${data.improvements.length})</h3>`;
      for (const r of data.improvements) html += `<div style="font-size:12px;padding:2px 0">❌ → ✅ ${r.scenario}</div>`;
      html += '</div>';
    }
    if (data.unchanged.length > 0) {
      html += `<div class="panel" style="margin-bottom:8px"><h3 style="font-size:13px;color:var(--fg2);margin-bottom:6px;cursor:pointer" onclick="this.nextElementSibling.classList.toggle('hidden')">Unchanged (${data.unchanged.length}) ▸</h3><div class="hidden">`;
      for (const r of data.unchanged) { const icon = r.b === true ? '✅' : r.b === false ? '❌' : '—'; html += `<div style="font-size:12px;padding:1px 0">${icon} ${r.scenario}</div>`; }
      html += '</div></div>';
    }

    // Prompt diff link
    if (data.promptHashA && data.promptHashB && data.promptHashA !== data.promptHashB) {
      html += `<button class="ask-btn" onclick="showPromptDiff('${data.promptHashA}','${data.promptHashB}')" style="margin-top:8px">Show Prompt Diff</button>`;
      html += `<div id="prompt-diff-panel"></div>`;
    }

    panel.innerHTML = html;
  } catch(e) { panel.innerHTML = `<div style="color:var(--red)">Error: ${e.message}</div>`; }
}

async function showPrompt(hash) {
  if (!hash || hash === '—') return;
  try {
    const r = await fetch(`/api/benchmarks/prompts?hash=${hash}`);
    const data = await r.json();
    if (data.error) { alert(data.error); return; }
    const win = window.open('', '_blank', 'width=800,height=600');
    win.document.write(`<pre style="font-family:monospace;white-space:pre-wrap;padding:16px;background:#0d1117;color:#c9d1d9">${esc(data.prompt_text)}</pre>`);
  } catch(e) { alert(e.message); }
}

async function showPromptDiff(hashA, hashB) {
  const panel = document.getElementById('prompt-diff-panel');
  if (!panel) return;
  try {
    const r = await fetch(`/api/benchmarks/prompts?hash=${hashA}&diff=${hashB}`);
    const data = await r.json();
    if (data.error) { panel.innerHTML = `<div style="color:var(--red)">${data.error}</div>`; return; }

    // Simple line-by-line diff
    const linesA = data.a.text.split('\n');
    const linesB = data.b.text.split('\n');
    let diffHtml = '<div style="font-family:var(--mono);font-size:11px;max-height:400px;overflow-y:auto;margin-top:8px;border:1px solid var(--border);border-radius:6px;padding:8px">';
    const maxLines = Math.max(linesA.length, linesB.length);
    for (let i = 0; i < maxLines; i++) {
      const a = linesA[i] || '';
      const b = linesB[i] || '';
      if (a === b) {
        diffHtml += `<div style="color:var(--fg2)">${esc(a)}</div>`;
      } else {
        if (a) diffHtml += `<div style="color:var(--red);background:rgba(248,81,73,0.1)">- ${esc(a)}</div>`;
        if (b) diffHtml += `<div style="color:var(--green);background:rgba(63,185,80,0.1)">+ ${esc(b)}</div>`;
      }
    }
    diffHtml += '</div>';
    panel.innerHTML = diffHtml;
  } catch(e) { panel.innerHTML = `<div style="color:var(--red)">Error: ${e.message}</div>`; }
}

// ── Digest ────────────────────────────────────────────────────────────

async function loadDigest(date) {
  const panel = document.getElementById('digest-panel');
  try {
    const params = date ? '?date=' + date : '';
    const r = await fetch('/api/digest' + params);
    const data = await r.json();
    if (!data.digest) {
      panel.innerHTML = '<div style="color:var(--fg2);font-size:13px;padding:8px">No digest yet — generated daily by the system.</div>';
      return;
    }

    // Date navigation
    const available = data.available || [];
    const currentIdx = available.indexOf(data.date);
    const prevDate = currentIdx < available.length - 1 ? available[currentIdx + 1] : null;
    const nextDate = currentIdx > 0 ? available[currentIdx - 1] : null;

    let nav = '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">';
    nav += prevDate ? `<button class="ask-btn" onclick="loadDigest('${prevDate}')">← ${prevDate}</button>` : '<span></span>';
    nav += `<span style="color:var(--fg2);font-size:12px;flex:1;text-align:center">${data.date} (${available.length} days available)</span>`;
    nav += nextDate ? `<button class="ask-btn" onclick="loadDigest('${nextDate}')">${nextDate} →</button>` : '<span></span>';
    nav += '</div>';

    // Simple markdown → HTML
    let html = data.digest
      .replace(/^# (.+)$/gm, '<h2 style="font-size:16px;margin:16px 0 8px">$1</h2>')
      .replace(/^## (.+)$/gm, '<h3 style="font-size:14px;color:var(--accent);margin:14px 0 6px">$1</h3>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/^- (.+)$/gm, '<div style="padding-left:12px">• $1</div>')
      .replace(/^(\|.+\|)$/gm, (row) => {
        if (row.match(/^\|[-|]+\|$/)) return '';
        const cells = row.split('|').filter(Boolean).map(c => c.trim());
        const tag = row === row.toUpperCase() ? 'th' : 'td';
        return '<tr>' + cells.map(c => `<${tag} style="padding:4px 8px;border-bottom:1px solid var(--border);font-size:12px">${c}</${tag}>`).join('') + '</tr>';
      })
      .replace(/(<tr>.*<\/tr>\n?)+/g, (m) => `<table style="width:100%;border-collapse:collapse;margin:8px 0">${m}</table>`)
      .replace(/\n\n/g, '<br>');

    panel.innerHTML = `<div class="panel" style="border-left:3px solid var(--accent)">${nav}${html}</div>`;
  } catch(e) {
    panel.innerHTML = '';
  }
}

async function browsePath(path) {
  kbCurrentPath = path;
  const tree = document.getElementById('kb-tree');
  const content = document.getElementById('kb-content');
  const breadcrumb = document.getElementById('kb-breadcrumb');

  // Breadcrumb
  const parts = path ? path.split('/') : [];
  let crumb = '<a href="#" onclick="event.preventDefault(); browsePath(\'\')">shared</a>';
  let accumulated = '';
  for (const part of parts) {
    accumulated += (accumulated ? '/' : '') + part;
    const p = accumulated;
    crumb += ` / <a href="#" onclick="event.preventDefault(); browsePath('${p}')">${part}</a>`;
  }
  breadcrumb.innerHTML = '📁 ' + crumb;

  tree.innerHTML = '<span style="color:var(--fg2)">Loading...</span>';

  try {
    const resp = await fetch(`/api/browse?path=${encodeURIComponent(path)}`);
    const data = await resp.json();

    if (data.type === 'dir') {
      // Render directory listing
      const dirs = data.entries.filter(e => e.type === 'dir');
      const files = data.entries.filter(e => e.type === 'file');

      let html = '';
      for (const d of dirs) {
        const childPath = path ? `${path}/${d.name}` : d.name;
        html += `<div class="request" onclick="browsePath('${childPath}')" style="padding:8px 12px">
          <span style="color:var(--accent)">📁 ${esc(d.name)}</span>
        </div>`;
      }
      for (const f of files) {
        const filePath = path ? `${path}/${f.name}` : f.name;
        const size = f.size ? `<span style="color:var(--fg2);font-size:11px;float:right">${(f.size/1024).toFixed(1)}KB</span>` : '';
        html += `<div class="request" onclick="viewFile('${filePath}')" style="padding:8px 12px">
          <span>📄 ${esc(f.name)}</span>${size}
        </div>`;
      }
      tree.innerHTML = html || '<span style="color:var(--fg2)">Empty directory</span>';
    } else if (data.type === 'file') {
      // Directly opened a file from URL
      renderFileContent(content, data.content, path);
    }
  } catch (err) {
    tree.innerHTML = `<span style="color:var(--red)">Error: ${err.message}</span>`;
  }
}

async function viewFile(path) {
  const content = document.getElementById('kb-content');
  content.innerHTML = '<span style="color:var(--fg2)">Loading...</span>';

  try {
    const resp = await fetch(`/api/browse?path=${encodeURIComponent(path)}`);
    const data = await resp.json();
    renderFileContent(content, data.content, path);
  } catch (err) {
    content.innerHTML = `<span style="color:var(--red)">Error: ${err.message}</span>`;
  }
}

function renderFileContent(el, text, path) {
  if (path.endsWith('.md') && window.marked && window.marked.parse) {
    let html = window.marked.parse(text);
    // Make KE-XXX, H-XXX, EXP-XXX clickable
    html = html.replace(/\b(KE-\d+)\b/g, '<a href="#" onclick="event.preventDefault(); browsePath(\'knowledge/entries\'); setTimeout(() => viewFile(\'knowledge/entries/$1.md\'), 200)">$1</a>');
    html = html.replace(/\b(H-\d+)\b/g, '<a href="#" onclick="event.preventDefault(); browsePath(\'knowledge/hypotheses\'); setTimeout(() => viewFile(\'knowledge/hypotheses/$1.md\'), 200)">$1</a>');
    html = html.replace(/\b(EXP-\d+)\b/g, '<a href="#" onclick="event.preventDefault(); browsePath(\'knowledge/experiments\'); setTimeout(() => viewFile(\'knowledge/experiments/$1/results.md\'), 200)">$1</a>');
    el.innerHTML = '<div class="md-rendered">' + html + '</div>';
  } else if (path.endsWith('.json')) {
    try {
      el.innerHTML = `<pre style="font-size:12px">${esc(JSON.stringify(JSON.parse(text), null, 2))}</pre>`;
    } catch {
      el.innerHTML = `<pre style="font-size:12px">${esc(text)}</pre>`;
    }
  } else {
    el.innerHTML = `<pre style="font-size:12px">${esc(text)}</pre>`;
  }
}

// ── Requests Tab ──────────────────────────────────────────────────────
let reqOffset = 0;
const reqLimit = 50;
let reqStatus = '';
let reqAgent = '';

async function loadRequestsTab() {
  const params = new URLSearchParams({ limit: reqLimit, offset: reqOffset });
  if (reqStatus) params.set('status', reqStatus);
  if (reqAgent) params.set('agent', reqAgent);

  try {
    const r = await fetch('/api/requests?' + params);
    const data = await r.json();
    renderRequestsTab(data);
  } catch(e) { console.error('Requests tab load error:', e); }

  // Populate agent dropdown if empty
  const sel = document.getElementById('req-agent-filter');
  if (sel.options.length <= 1) {
    try {
      const r = await fetch('/api/agents/health');
      const data = await r.json();
      if (data.agents) {
        data.agents.forEach(a => {
          const opt = document.createElement('option');
          opt.value = a.agent;
          opt.textContent = a.agent;
          sel.appendChild(opt);
        });
      }
    } catch(e) {}
  }
}

function reqAge(ts) {
  const diff = Date.now() - ts;
  if (diff < 60000) return Math.round(diff/1000) + 's';
  if (diff < 3600000) return Math.round(diff/60000) + 'm';
  if (diff < 86400000) return Math.round(diff/3600000) + 'h';
  return Math.round(diff/86400000) + 'd';
}

function renderRequestsTab(data) {
  const tbody = document.getElementById('req-table-body');
  if (!data.requests.length) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--fg2);padding:20px">No requests found</td></tr>';
    document.getElementById('req-pagination').innerHTML = '';
    return;
  }

  tbody.innerHTML = data.requests.map(r => {
    const taskPreview = esc((r.task || '').slice(0, 120)) + ((r.task || '').length > 120 ? '…' : '');
    return `<tr class="req-row" data-rid="${r.requestId}">
      <td style="white-space:nowrap">${reqAge(r.createdAt)}</td>
      <td>${esc(r.fromEntity)}</td>
      <td>${esc(r.toAgent)}</td>
      <td><span class="req-method">${esc(r.method)}</span></td>
      <td><span class="req-status ${r.status}">${r.status}</span></td>
      <td style="max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${taskPreview}</td>
    </tr>
    <tr class="req-detail-row" id="req-detail-${r.requestId}" style="display:none">
      <td colspan="6">
        <div class="req-detail">
          <div style="display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12px;margin-bottom:8px">
            <span style="color:var(--fg2)">Request ID:</span><span>${r.requestId}</span>
            <span style="color:var(--fg2)">Created:</span><span>${new Date(r.createdAt).toLocaleString()}</span>
            ${r.completedAt ? `<span style="color:var(--fg2)">Completed:</span><span>${new Date(r.completedAt).toLocaleString()}</span>` : ''}
            ${r.durationMs ? `<span style="color:var(--fg2)">Duration:</span><span>${r.durationMs < 60000 ? Math.round(r.durationMs/1000)+'s' : Math.round(r.durationMs/60000)+'m'}</span>` : ''}
            ${r.sessionId ? `<span style="color:var(--fg2)">Session:</span><span>${r.sessionId}</span>` : ''}
            ${r.source ? `<span style="color:var(--fg2)">Source:</span><span>${r.source}</span>` : ''}
            ${r.error ? `<span style="color:var(--fg2)">Error:</span><span style="color:var(--red)">${esc(r.error)}</span>` : ''}
          </div>
          <div class="task-text">${esc(r.task || '')}</div>
          ${r.summary ? `<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)"><strong style="color:var(--fg2);font-size:11px">Summary:</strong><div style="margin-top:4px;font-size:12px">${esc(r.summary)}</div></div>` : ''}
        </div>
      </td>
    </tr>`;
  }).join('');

  // Click handlers for expand/collapse
  tbody.querySelectorAll('.req-row').forEach(row => {
    row.style.cursor = 'pointer';
    row.addEventListener('click', () => {
      const rid = row.dataset.rid;
      const detail = document.getElementById('req-detail-' + rid);
      const isVisible = detail.style.display !== 'none';
      // Close all others
      tbody.querySelectorAll('.req-detail-row').forEach(r => r.style.display = 'none');
      if (!isVisible) detail.style.display = 'table-row';
    });
  });

  // Pagination
  const pg = document.getElementById('req-pagination');
  const hasPrev = reqOffset > 0;
  const hasNext = reqOffset + reqLimit < data.total;
  pg.innerHTML = `
    <button ${hasPrev ? '' : 'disabled'} onclick="reqOffset=Math.max(0,reqOffset-reqLimit);loadRequestsTab()">← Prev</button>
    <span style="color:var(--fg2);font-size:12px">${reqOffset+1}–${Math.min(reqOffset+reqLimit,data.total)} of ${data.total}</span>
    <button ${hasNext ? '' : 'disabled'} onclick="reqOffset+=reqLimit;loadRequestsTab()">Next →</button>
  `;
}

// Filter button handlers
document.querySelectorAll('.req-filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.req-filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    reqStatus = btn.dataset.status;
    reqOffset = 0;
    loadRequestsTab();
  });
});

document.getElementById('req-agent-filter').addEventListener('change', (e) => {
  reqAgent = e.target.value;
  reqOffset = 0;
  loadRequestsTab();
});

// ── Metrics Tab ───────────────────────────────────────────────────────
const PINNED_METRICS = ['optimizer.workflow-coverage', 'optimizer.workflow-effectiveness', 'system.handler-health', 'system.stuck-requests', 'coder.quality', 'coach.instruction-compliance'];

async function loadMetricsTab() {
  try {
    const res = await fetch('/api/metrics');
    const data = await res.json();
    const container = document.getElementById('metrics-by-owner');
    const alertsEl = document.getElementById('metrics-alerts');
    const recentEl = document.getElementById('metrics-recent');

    // Alerts
    if (!data.alerts || data.alerts.length === 0) {
      alertsEl.innerHTML = '<div style="padding:8px 12px;background:rgba(76,175,80,0.1);border:1px solid rgba(76,175,80,0.3);border-radius:6px;color:var(--green);font-size:13px">✓ All metrics within thresholds</div>';
    } else {
      alertsEl.innerHTML = data.alerts.map(a => `<div style="padding:8px 12px;background:rgba(244,67,54,0.1);border:1px solid rgba(244,67,54,0.3);border-radius:6px;margin-bottom:6px;font-size:13px;color:var(--red)">⚠ <b>${a.name}</b> (${a.owner}): ${a.current}${a.unit||''} — threshold ${a.alert_direction === 'above' ? '>' : '<'} ${a.threshold}${a.unit||''}</div>`).join('');
    }

    const snapMap = {};
    for (const s of data.latestSnapshots) snapMap[s.metric_id] = s;

    const pinned = data.metrics.filter(m => PINNED_METRICS.includes(m.id));
    const unpinned = data.metrics.filter(m => !PINNED_METRICS.includes(m.id));
    let html = '';

    // Pinned metrics cards
    if (pinned.length > 0) {
      html += `<div style="background:var(--bg2);border:2px solid var(--accent);border-radius:8px;padding:16px;margin-bottom:16px">`;
      html += `<h3 style="margin:0 0 12px;font-size:14px;color:var(--accent)">⭐ Pinned Metrics</h3>`;
      html += `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px">`;
      for (const m of pinned) {
        const val = m.current != null ? Number(m.current).toFixed(2) : '—';
        const isAlert = m.threshold != null && m.current != null && (m.alert_direction === 'above' ? m.current > m.threshold : m.current < m.threshold);
        const border = isAlert ? 'var(--red)' : 'var(--border)';
        const snap = snapMap[m.id];
        const ago = snap ? timeAgo(snap.measured_at) : '—';
        html += `<div style="background:var(--bg);border:1px solid ${border};border-radius:6px;padding:12px;cursor:pointer" onclick="showMetricHistory('${m.id}')">`;
        html += `<div style="font-size:11px;color:var(--fg2)">${m.owner} · ${m.type}</div>`;
        html += `<div style="font-size:18px;font-weight:bold;margin:4px 0;${isAlert?'color:var(--red)':''}">${val}${m.unit||''}</div>`;
        html += `<div style="font-size:12px;color:var(--fg)">${m.name}</div>`;
        html += `<div style="font-size:11px;color:var(--fg2);margin-top:4px">target: ${m.target}${m.unit||''} · ${ago}</div>`;
        html += `<div id="spark-${m.id.replace(/\./g,'-')}" style="height:30px;margin-top:6px"></div>`;
        html += `</div>`;
      }
      html += `</div></div>`;
    }

    // System overview cards
    const healthy = data.metrics.filter(m => m.threshold != null && m.current != null && (m.alert_direction === 'above' ? m.current <= m.threshold : m.current >= m.threshold)).length;
    const alerting = data.alerts?.length || 0;
    html += `<div style="display:flex;gap:12px;margin-bottom:16px">`;
    html += `<div style="flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:12px;text-align:center"><div style="font-size:24px;font-weight:bold;color:var(--green)">${healthy}</div><div style="font-size:11px;color:var(--fg2)">Healthy</div></div>`;
    html += `<div style="flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:12px;text-align:center"><div style="font-size:24px;font-weight:bold;color:var(--red)">${alerting}</div><div style="font-size:11px;color:var(--fg2)">Alerting</div></div>`;
    html += `<div style="flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:12px;text-align:center"><div style="font-size:24px;font-weight:bold">${data.metrics.length}</div><div style="font-size:11px;color:var(--fg2)">Total Active</div></div>`;
    html += `</div>`;

    // By owner tables
    const byOwner = {};
    for (const m of unpinned) { if (!byOwner[m.owner]) byOwner[m.owner] = []; byOwner[m.owner].push(m); }
    for (const [owner, ms] of Object.entries(byOwner).sort()) {
      html += `<div style="background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px">`;
      html += `<h3 style="margin:0 0 10px;font-size:14px;color:var(--fg)">${owner} <span style="color:var(--fg2);font-weight:normal;font-size:12px">(${ms.length})</span></h3>`;
      html += `<table style="width:100%;border-collapse:collapse;font-size:12px">`;
      html += `<tr style="border-bottom:1px solid var(--border)"><th style="text-align:left;padding:4px 8px;color:var(--fg2)">Metric</th><th style="padding:4px 8px;color:var(--fg2)">Current</th><th style="padding:4px 8px;color:var(--fg2)">Target</th><th style="padding:4px 8px;color:var(--fg2)">Type</th><th style="padding:4px 8px;color:var(--fg2)">Updated</th></tr>`;
      for (const m of ms) {
        const snap = snapMap[m.id]; const val = m.current != null ? m.current : '—';
        const isAlert = m.threshold != null && m.current != null && (m.alert_direction === 'above' ? m.current > m.threshold : m.current < m.threshold);
        html += `<tr style="border-bottom:1px solid var(--bg3,#333);cursor:pointer" onclick="showMetricHistory('${m.id}')">`;
        html += `<td style="padding:4px 8px">${m.name}<br><span style="color:var(--fg2);font-size:11px">${m.id}</span></td>`;
        html += `<td style="padding:4px 8px;text-align:center;${isAlert?'color:var(--red);font-weight:bold':''}">${val}${m.unit||''}</td>`;
        html += `<td style="padding:4px 8px;text-align:center;color:var(--fg2)">${m.target}${m.unit||''}</td>`;
        html += `<td style="padding:4px 8px;text-align:center;color:var(--fg2)">${m.type}</td>`;
        html += `<td style="padding:4px 8px;text-align:center;color:var(--fg2);font-size:11px">${snap ? timeAgo(snap.measured_at) : '—'}</td></tr>`;
      }
      html += `</table></div>`;
    }
    container.innerHTML = html;
    for (const m of pinned) loadSparkline(m.id);
    renderRecentSnapshots(data.recentSnapshots);
  } catch (e) { document.getElementById('metrics-by-owner').innerHTML = `<p style="color:var(--red)">Failed: ${e.message}</p>`; }
}

async function loadSparkline(metricId) {
  try {
    const res = await fetch(`/api/metrics/${encodeURIComponent(metricId)}/history?days=7`);
    const data = await res.json();
    const el = document.getElementById('spark-' + metricId.replace(/\./g, '-'));
    if (!el || !data.snapshots || data.snapshots.length < 2) return;
    const values = data.snapshots.map(s => s.value);
    const min = Math.min(...values); const max = Math.max(...values); const range = max - min || 1;
    const w = el.offsetWidth || 250; const h = 30;
    const step = w / (values.length - 1);
    const pts = values.map((v, i) => `${i*step},${h-((v-min)/range)*(h-4)-2}`).join(' ');
    el.innerHTML = `<svg width="${w}" height="${h}"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.5"/></svg>`;
  } catch {}
}

async function showMetricHistory(metricId) {
  try {
    const res = await fetch(`/api/metrics/${encodeURIComponent(metricId)}/history?days=14`);
    const data = await res.json();
    const el = document.getElementById('metrics-recent');
    let html = `<div style="background:var(--bg2);border:1px solid var(--accent);border-radius:8px;padding:16px">`;
    html += `<h3 style="margin:0 0 12px;font-size:14px;color:var(--fg)">📈 ${metricId} — 14d history <button onclick="loadMetricsTab()" style="float:right;background:var(--bg3,#333);border:1px solid var(--border);color:var(--fg);padding:2px 8px;border-radius:4px;cursor:pointer;font-size:11px">Back</button></h3>`;
    if (!data.snapshots || data.snapshots.length === 0) { html += `<p style="color:var(--fg2)">No snapshots</p>`; }
    else {
      const values = data.snapshots.map(s => s.value);
      const min = Math.min(...values); const max = Math.max(...values); const range = max-min||1;
      const w=600; const h=120; const step=w/Math.max(values.length-1,1);
      const pts = values.map((v,i) => `${i*step},${h-((v-min)/range)*(h-10)-5}`).join(' ');
      html += `<svg width="100%" viewBox="0 0 ${w} ${h}" style="margin-bottom:12px"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2"/></svg>`;
      html += `<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--fg2);margin-bottom:12px"><span>min: ${min.toFixed(2)}</span><span>max: ${max.toFixed(2)}</span><span>latest: ${values[values.length-1].toFixed(2)}</span><span>${data.snapshots.length} points</span></div>`;
      html += `<table style="width:100%;border-collapse:collapse;font-size:12px"><tr style="border-bottom:1px solid var(--border)"><th style="text-align:left;padding:4px 8px;color:var(--fg2)">Value</th><th style="padding:4px 8px;color:var(--fg2)">When</th><th style="text-align:left;padding:4px 8px;color:var(--fg2)">Note</th></tr>`;
      for (const s of data.snapshots.slice().reverse().slice(0,20)) {
        html += `<tr style="border-bottom:1px solid var(--bg3,#333)"><td style="padding:4px 8px">${s.value}</td><td style="padding:4px 8px;text-align:center;color:var(--fg2);font-size:11px">${timeAgo(s.measured_at)}</td><td style="padding:4px 8px;color:var(--fg2);font-size:11px">${s.note||''}</td></tr>`;
      }
      html += `</table>`;
    }
    html += `</div>`;
    el.innerHTML = html;
  } catch (e) { document.getElementById('metrics-recent').innerHTML = `<p style="color:var(--red)">Failed: ${e.message}</p>`; }
}

function renderRecentSnapshots(snapshots) {
  let html = `<div style="background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:16px">`;
  html += `<h3 style="margin:0 0 10px;font-size:14px;color:var(--fg)">Recent Snapshots</h3>`;
  html += `<table style="width:100%;border-collapse:collapse;font-size:12px"><tr style="border-bottom:1px solid var(--border)"><th style="text-align:left;padding:4px 8px;color:var(--fg2)">Metric</th><th style="padding:4px 8px;color:var(--fg2)">Value</th><th style="padding:4px 8px;color:var(--fg2)">When</th><th style="text-align:left;padding:4px 8px;color:var(--fg2)">Note</th></tr>`;
  for (const s of (snapshots||[]).slice(0,30)) {
    html += `<tr style="border-bottom:1px solid var(--bg3,#333);cursor:pointer" onclick="showMetricHistory('${s.metric_id}')"><td style="padding:4px 8px">${s.metric_id}</td><td style="padding:4px 8px;text-align:center">${s.value}</td><td style="padding:4px 8px;text-align:center;color:var(--fg2);font-size:11px">${timeAgo(s.measured_at)}</td><td style="padding:4px 8px;color:var(--fg2);font-size:11px">${s.note||''}</td></tr>`;
  }
  html += `</table></div>`;
  document.getElementById('metrics-recent').innerHTML = html;
}

function timeAgo(ts) {
  if (!ts) return '—';
  const diff = Date.now() - ts;
  if (diff < 60000) return 'just now';
  if (diff < 3600000) return Math.floor(diff/60000) + 'm ago';
  if (diff < 86400000) return Math.floor(diff/3600000) + 'h ago';
  return Math.floor(diff/86400000) + 'd ago';
}

// ── Projects ──────────────────────────────────────────────────────────

async function loadProjects() {
  try {
    const res = await fetch('/api/projects');
    const projects = await res.json();
    const el = document.getElementById('projects-content');

    // Sort: active first, then by updatedAt desc
    const statusOrder = {active:0, blocked:1, paused:2, done:3, complete:4};
    projects.sort((a,b) => (statusOrder[a.status]??9) - (statusOrder[b.status]??9) || b.updatedAt - a.updatedAt);

    let html = `<table style="width:100%;border-collapse:collapse;font-size:13px">`;
    html += `<tr style="border-bottom:2px solid var(--border);text-align:left">`;
    html += `<th style="padding:8px">Project</th><th>Owner</th><th>Status</th><th>Health</th><th>Milestones</th><th>Metrics</th><th>Iter</th><th>Updated</th>`;
    html += `</tr>`;

    for (const p of projects) {
      const healthColor = !p.health ? 'var(--fg2)' :
        p.health.includes('PASS') || p.health.includes('COMPLETE') ? 'var(--green)' :
        p.health.includes('FAIL') ? 'var(--red)' : 'var(--yellow)';
      const statusColor = p.status === 'active' ? 'var(--green)' :
        p.status === 'blocked' ? 'var(--red)' :
        p.status === 'paused' ? 'var(--yellow)' : 'var(--fg2)';
      const msBar = p.milestonesTotal > 0
        ? `<div style="display:flex;align-items:center;gap:4px"><div style="width:60px;height:6px;background:var(--bg3);border-radius:3px"><div style="width:${Math.round(p.milestonesDone/p.milestonesTotal*100)}%;height:100%;background:var(--green);border-radius:3px"></div></div><span>${p.milestonesDone}/${p.milestonesTotal}</span></div>`
        : '<span style="color:var(--fg2)">—</span>';

      html += `<tr style="border-bottom:1px solid var(--border);cursor:pointer" onclick="showProjectDetail('${esc(p.path)}')">` +
        `<td style="padding:8px;font-weight:500">${esc(p.name)}</td>` +
        `<td>${esc(p.owner)}</td>` +
        `<td><span style="color:${statusColor}">${esc(p.status)}</span></td>` +
        `<td><span style="color:${healthColor}">${p.health || '—'}</span></td>` +
        `<td>${msBar}</td>` +
        `<td style="font-size:12px">${p.metrics?.length ? p.metrics.map(m => `<span style="color:${m.breached ? 'var(--red)' : 'var(--green)'}">${m.id.split('.').pop()}: ${m.current != null ? Number(m.current).toFixed(2) : '?'} ${m.breached ? '\u2717' : '\u2713'}</span>`).join(', ') : '\u2014'}</td>` +
        `<td>${p.iteration}</td>` +
        `<td style="color:var(--fg2);font-size:12px">${timeAgo(p.updatedAt)}</td>` +
        `</tr>`;
    }
    html += `</table>`;
    el.innerHTML = html;
  } catch(e) {
    document.getElementById('projects-content').innerHTML = `<div style="color:var(--red)">Failed to load projects: ${e.message}</div>`;
  }
}

let _projectDetailPath = '';
async function showProjectDetail(path) {
  _projectDetailPath = path;
  const el = document.getElementById('projects-content');
  let html = `<button onclick="loadProjects()" style="margin-bottom:12px;padding:4px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:4px;color:var(--fg);cursor:pointer">← Back</button>`;
  html += `<div style="display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:12px">`;
  html += `<button class="tab-btn active" onclick="switchProjectTab(this,'project')" style="background:none;border:none;border-bottom:2px solid var(--accent);color:var(--accent);padding:8px 16px;cursor:pointer;font-size:13px">Project</button>`;
  html += `<button class="tab-btn" onclick="switchProjectTab(this,'journal')" style="background:none;border:none;border-bottom:2px solid transparent;color:var(--fg2);padding:8px 16px;cursor:pointer;font-size:13px">Journal</button>`;
  html += `<button class="tab-btn" onclick="switchProjectTab(this,'sessions')" style="background:none;border:none;border-bottom:2px solid transparent;color:var(--fg2);padding:8px 16px;cursor:pointer;font-size:13px">Sessions</button>`;
  html += `</div>`;
  html += `<div id="project-tab-content" style="background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:16px;max-height:70vh;overflow-y:auto"></div>`;
  el.innerHTML = html;
  loadProjectTab('project');
}

function switchProjectTab(btn, tab) {
  btn.parentElement.querySelectorAll('.tab-btn').forEach(b => { b.style.borderBottomColor = 'transparent'; b.style.color = 'var(--fg2)'; });
  btn.style.borderBottomColor = 'var(--accent)'; btn.style.color = 'var(--accent)';
  loadProjectTab(tab);
}

async function loadProjectTab(tab) {
  const el = document.getElementById('project-tab-content');
  if (!el) return;
  try {
    if (tab === 'project') {
      const res = await fetch(`/api/browse?path=${encodeURIComponent(_projectDetailPath + (_projectDetailPath.endsWith('.md') ? '' : '/project.md'))}`);
      const data = await res.json();
      el.style.whiteSpace = 'pre-wrap'; el.style.fontFamily = 'monospace'; el.style.fontSize = '13px';
      el.textContent = data.content || 'No content';
    } else if (tab === 'journal') {
      const res = await fetch(`/api/projects/journal?path=${encodeURIComponent(_projectDetailPath)}`);
      const data = await res.json();
      el.style.whiteSpace = 'pre-wrap'; el.style.fontFamily = 'monospace'; el.style.fontSize = '13px';
      el.textContent = data.content || 'No journal';
    } else if (tab === 'sessions') {
      const res = await fetch(`/api/projects/sessions?path=${encodeURIComponent(_projectDetailPath)}`);
      const rows = await res.json();
      if (rows.length === 0) { el.innerHTML = '<div style="color:var(--fg2)">No sessions found for this project.</div>'; return; }
      let html = `<table style="width:100%;border-collapse:collapse;font-size:13px">`;
      html += `<tr style="border-bottom:2px solid var(--border)"><th style="padding:6px;text-align:left">Session</th><th>Agent</th><th>Status</th><th>Ops</th><th>Time</th><th>Task</th></tr>`;
      for (const s of rows) {
        html += `<tr style="border-bottom:1px solid var(--border);cursor:pointer" onclick="location.hash='dashboard';document.querySelector('[data-tab=dashboard]').click();setTimeout(()=>loadSessionDetail('${esc(s.sessionId)}'),100)">`;
        html += `<td style="padding:6px;font-family:monospace;font-size:11px">${esc((s.sessionId||'').slice(-12))}</td>`;
        html += `<td>${esc(s.agent||'')}</td>`;
        html += `<td>${esc(s.status||'')}</td>`;
        html += `<td>${s.opCount ?? ''}</td>`;
        html += `<td style="color:var(--fg2);font-size:12px">${s.startedAt ? timeAgo(s.startedAt) : ''}</td>`;
        html += `<td style="color:var(--fg2);font-size:12px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc((s.task||'').slice(0,60))}</td>`;
        html += `</tr>`;
      }
      html += `</table>`;
      el.style.whiteSpace = 'normal'; el.style.fontFamily = 'inherit'; el.style.fontSize = 'inherit';
      el.innerHTML = html;
    }
  } catch(e) {
    el.innerHTML = `<div style="color:var(--red)">Failed: ${e.message}</div>`;
  }
}

// ── Events ───────────────────────────────────────────────────────────

async function loadEvents() {
  try {
    const owner = document.getElementById('events-owner')?.value || '';
    const type = document.getElementById('events-type')?.value || '';
    let url = '/api/events?limit=200';
    if (owner) url += `&owner=${encodeURIComponent(owner)}`;
    if (type) url += `&type=${encodeURIComponent(type)}`;
    const res = await fetch(url);
    const events = await res.json();
    const el = document.getElementById('events-content');
    const countEl = document.getElementById('events-count');

    // Populate filter dropdowns from data
    const owners = new Set(events.map(e => e.owner).filter(Boolean));
    const types = new Set(events.map(e => e.event_type).filter(Boolean));
    const ownerSel = document.getElementById('events-owner');
    const typeSel = document.getElementById('events-type');
    if (ownerSel && ownerSel.options.length <= 1) {
      for (const o of [...owners].sort()) {
        const opt = document.createElement('option'); opt.value = o; opt.textContent = o;
        ownerSel.appendChild(opt);
      }
    }
    if (typeSel && typeSel.options.length <= 1) {
      for (const t of [...types].sort()) {
        const opt = document.createElement('option'); opt.value = t; opt.textContent = t;
        typeSel.appendChild(opt);
      }
    }

    countEl.textContent = `${events.length} events`;

    if (events.length === 0) {
      el.innerHTML = '<div style="padding:16px;color:var(--fg2)">No events recorded yet. Events will appear here once the event persistence (G1) is deployed.</div>';
      return;
    }

    let html = `<table style="width:100%;border-collapse:collapse;font-size:13px">`;
    html += `<tr style="border-bottom:2px solid var(--border);text-align:left">`;
    html += `<th style="padding:6px">Time</th><th>Type</th><th>Owner</th><th>Source</th><th>Data</th>`;
    html += `</tr>`;
    for (const e of events) {
      const data = e.data ? JSON.parse(e.data) : {};
      const summary = Object.entries(data).filter(([k]) => k !== 'owner' && k !== 'source').map(([k,v]) => `${k}=${typeof v === 'string' ? v.slice(0,30) : v}`).join(', ');
      html += `<tr style="border-bottom:1px solid var(--border)">` +
        `<td style="padding:6px;color:var(--fg2);font-size:12px;white-space:nowrap">${timeAgo(e.timestamp)}</td>` +
        `<td style="font-family:monospace">${esc(e.event_type || '')}</td>` +
        `<td>${esc(e.owner || '—')}</td>` +
        `<td style="color:var(--fg2)">${esc(e.source || '—')}</td>` +
        `<td style="color:var(--fg2);font-size:12px;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(summary)}</td>` +
        `</tr>`;
    }
    html += `</table>`;
    el.innerHTML = html;
  } catch(e) {
    document.getElementById('events-content').innerHTML = `<div style="color:var(--red)">Failed to load events: ${e.message}</div>`;
  }
}
</script>
</body>
</html>
