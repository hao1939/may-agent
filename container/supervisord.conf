[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# ── Display & GUI ──────────────────────────────────────────────────────────

[program:xvfb]
command=Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset
autorestart=true
startsecs=1
priority=10
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:fluxbox]
command=fluxbox
autorestart=true
startsecs=1
priority=20
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:x11vnc]
command=x11vnc -display :99 -forever -shared -rfbport 5900 -nopw -quiet -xkb -noxrecord -noxfixes -noxdamage
autorestart=true
startsecs=1
priority=30
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:websockify]
command=websockify --web /usr/share/novnc 6080 localhost:5900
autorestart=true
startsecs=2
priority=40
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:chrome]
command=%(ENV_CHROME_BIN)s --no-sandbox --disable-gpu --no-first-run --disable-dev-shm-usage --start-maximized --remote-debugging-port=9222 --user-data-dir=/app/.state/chrome-profile
autorestart=true
startsecs=2
priority=70
stdout_logfile=/dev/null
stderr_logfile=/tmp/chrome.log
stderr_logfile_maxbytes=1048576

# ── may-agent ──────────────────────────────────────────────────────────────

[program:may-agent]
command=/usr/local/bin/may-agent %(ENV_MAY_ARGS)s
autorestart=true
startsecs=0
startretries=999
priority=100
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
