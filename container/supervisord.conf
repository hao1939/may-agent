[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0770
chown=root:mayagent

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# ── Display & GUI ──────────────────────────────────────────────────────────

[program:xvfb]
command=Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset
autorestart=true
startsecs=1
priority=10
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:fluxbox]
command=fluxbox
autorestart=true
startsecs=1
priority=20
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:x11vnc]
command=x11vnc -display :99 -forever -shared -rfbport 5900 -nopw -quiet -xkb -noxrecord -noxfixes -noxdamage
autorestart=true
startsecs=1
priority=30
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:websockify]
command=websockify --web /usr/share/novnc 6080 localhost:5900
autorestart=true
startsecs=2
priority=40
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:chrome]
command=/usr/local/bin/start-chrome.sh
autorestart=true
startsecs=2
priority=70
stdout_logfile=/dev/null
stderr_logfile=/tmp/chrome.log
stderr_logfile_maxbytes=1048576

# ── Shared Herdr web terminal ────────────────────────────────────────────

# Herdr owns the persistent terminal state. Browser and ttyd disconnects do
# not stop this process or the shells running inside the named session.
[program:terminal-herdr]
user=mayagent
directory=/app
# Keep the original session key so existing persisted panes survive the route
# rename from the Terminal 2 pilot to the primary terminal.
command=/usr/local/bin/may-herdr --session may-terminal2 server
autorestart=true
startsecs=1
startretries=999
priority=80
stopwaitsecs=10
stdout_logfile=/app/.state/runtime-logs/terminal-herdr.stdout.log
stdout_logfile_maxbytes=10485760
stdout_logfile_backups=3
stderr_logfile=/app/.state/runtime-logs/terminal-herdr.stderr.log
stderr_logfile_maxbytes=10485760
stderr_logfile_backups=3

# Each browser gets a lightweight Herdr client, while all clients attach to
# the same named server session above. --writable is intentional: this setup
# models every browser as the same operator.
[program:terminal-ttyd]
user=mayagent
directory=/app
command=/usr/local/bin/ttyd --writable --interface /tmp/may-agent-ttyd.sock --socket-owner mayagent:mayagent --base-path /terminal --index /usr/local/share/ttyd/index.html /usr/local/bin/may-herdr --session may-terminal2
autorestart=true
startsecs=1
startretries=999
priority=85
stopasgroup=true
killasgroup=true
stopwaitsecs=5
stdout_logfile=/app/.state/runtime-logs/terminal-ttyd.stdout.log
stdout_logfile_maxbytes=10485760
stdout_logfile_backups=3
stderr_logfile=/app/.state/runtime-logs/terminal-ttyd.stderr.log
stderr_logfile_maxbytes=10485760
stderr_logfile_backups=3

# ── may-agent ──────────────────────────────────────────────────────────────

[program:may-agent-maintenance]
user=mayagent
command=/usr/local/bin/may-agent --maintenance --maintenance-interval-ms 3600000
autorestart=true
startsecs=0
startretries=999
priority=90
stopwaitsecs=5
stdout_logfile=/app/.state/runtime-logs/may-agent-maintenance.stdout.log
stdout_logfile_maxbytes=10485760
stdout_logfile_backups=3
stderr_logfile=/app/.state/runtime-logs/may-agent-maintenance.stderr.log
stderr_logfile_maxbytes=10485760
stderr_logfile_backups=3

[program:may-agent]
user=mayagent
command=/usr/local/bin/may-agent %(ENV_MAY_ARGS)s
autorestart=true
startsecs=0
startretries=999
priority=100
stopwaitsecs=10
stdout_logfile=/app/.state/runtime-logs/may-agent.stdout.log
stdout_logfile_maxbytes=10485760
stdout_logfile_backups=5
stderr_logfile=/app/.state/runtime-logs/may-agent.stderr.log
stderr_logfile_maxbytes=10485760
stderr_logfile_backups=5

[program:may-agent-web]
user=mayagent
command=/usr/local/bin/may-agent --web
environment=DAEMON_INSTANCE="%(ENV_INSTANCE)s",DAEMON_AGENT="%(ENV_DAEMON_AGENT)s",WEB_PORT="8081"
autorestart=true
startsecs=0
startretries=999
priority=110
stopwaitsecs=5
stdout_logfile=/app/.state/runtime-logs/may-agent-web.stdout.log
stdout_logfile_maxbytes=10485760
stdout_logfile_backups=5
stderr_logfile=/app/.state/runtime-logs/may-agent-web.stderr.log
stderr_logfile_maxbytes=10485760
stderr_logfile_backups=5

# Keep the dashboard and terminal on one browser origin. nginx owns the public
# 8080 listener, forwarding the dashboard to 8081 and ttyd's /terminal/ route
# over a local Unix socket. ttyd does not open a second TCP port.
[program:may-agent-web-proxy]
command=/usr/sbin/nginx -c /etc/may-agent-nginx.conf
autorestart=true
startsecs=1
startretries=999
priority=115
stopasgroup=true
killasgroup=true
stopwaitsecs=5
stdout_logfile=/app/.state/runtime-logs/may-agent-web-proxy.stdout.log
stdout_logfile_maxbytes=10485760
stdout_logfile_backups=3
stderr_logfile=/app/.state/runtime-logs/may-agent-web-proxy.stderr.log
stderr_logfile_maxbytes=10485760
stderr_logfile_backups=3

[program:may-agent-restarter]
command=/usr/local/bin/may-agent-supervisor-restart
autostart=false
autorestart=false
startsecs=0
startretries=0
priority=120
stdout_logfile=/tmp/may-agent-supervisor-restart.log
stdout_logfile_maxbytes=1048576
stderr_logfile=/tmp/may-agent-supervisor-restart.log
stderr_logfile_maxbytes=1048576
