[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# ── Display & GUI ──────────────────────────────────────────────────────────

[program:xvfb]
command=Xvfb :%(ENV_DISPLAY_NUM)s -screen 0 %(ENV_SCREEN_RESOLUTION)s -ac +extension GLX +render -noreset
autorestart=true
startsecs=1
priority=10
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:fluxbox]
command=fluxbox
autorestart=true
startsecs=1
priority=20
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:x11vnc]
command=x11vnc -display :%(ENV_DISPLAY_NUM)s -forever -shared -rfbport %(ENV_VNC_PORT)s -nopw -quiet -xkb -noxrecord -noxfixes -noxdamage
autorestart=true
startsecs=1
priority=30
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:websockify]
command=websockify --web /usr/share/novnc %(ENV_NOVNC_PORT)s localhost:%(ENV_VNC_PORT)s
autorestart=true
startsecs=2
priority=40
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:chrome]
command=/usr/local/bin/wait-for-web.sh %(ENV_CHROME_BIN)s --no-sandbox --disable-gpu --no-first-run --disable-dev-shm-usage --start-maximized --remote-debugging-port=9222 --user-data-dir=/app/.state/chrome-profile
autorestart=true
startsecs=2
priority=70
stdout_logfile=/dev/null
stderr_logfile=/tmp/chrome.log
stderr_logfile_maxbytes=1048576

# ── Web UI dashboard ──────────────────────────────────────────────────────
# Runs independently — stays up when may-agent crashes/restarts.

[program:web]
command=%(ENV_WEB_BIN)s --state-dir %(ENV_STATE_DIR)s --port %(ENV_WEB_PORT)s
autorestart=true
startsecs=3
startretries=5
priority=60
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

# ── may-agent (launcher binary — handles hot-reload internally) ───────────
# The launcher supervises the worker process (exit 100 = hot-reload).
# supervisord restarts the launcher itself if it crashes or gives up.

[program:may-agent]
command=%(ENV_MAY_BIN)s %(ENV_MAY_ARGS)s
autorestart=true
startsecs=0
startretries=999
priority=100
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
