name: may-agent

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: may-agent-litellm
    hostname: litellm
    restart: unless-stopped
    stop_grace_period: 5s
    logging:
      driver: k8s-file
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    volumes:
      - ../litellm/config.yaml:/app/config.yaml:ro
      - ../litellm/github_copilot:/home/litellm/.config/litellm/github_copilot:rw
    environment:
      - HOME=/home/litellm
      - GITHUB_COPILOT_TOKEN_DIR=/home/litellm/.config/litellm/github_copilot
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  may:
    build:
      context: ..
      dockerfile: container/Dockerfile
    image: localhost/may-agent:latest
    container_name: may-agent
    hostname: may-agent
    restart: unless-stopped
    stop_grace_period: 10s
    logging:
      driver: k8s-file
    env_file: ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${NOVNC_PORT:-6080}:6080"
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - ../agents:/app/agents
      - ../.state:/app/.state
    environment:
      - INSTANCE=${INSTANCE:-background}
      - MODEL_BASE_URL=http://litellm:4000
      - CONTEXT_LEARN_AGENTS=coder,may,bob,coach,optimizer,tech-lead
    depends_on:
      litellm:
        condition: service_healthy

