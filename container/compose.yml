name: may-agent

services:
  may:
    build:
      context: ..
      dockerfile: container/Dockerfile
    image: localhost/may-agent:latest
    container_name: may-agent
    hostname: may-agent
    restart: unless-stopped
    stop_grace_period: 10s
    # Bubblewrap needs user-namespace syscalls to install the narrower
    # read-only filesystem used by May analysis. The container still receives
    # no SYS_ADMIN capability and the worker runs as the mayagent user.
    security_opt:
      - seccomp=unconfined
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "6", "http://127.0.0.1:8080/api/readiness"]
      interval: 10s
      timeout: 7s
      retries: 6
      start_period: 10s
    logging:
      driver: json-file
    env_file: ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${NOVNC_PORT:-6080}:6080"
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - /app:/app
      - /app/sources/aks-rp:/app/sources/aks-rp:ro
    environment:
      - INSTANCE=${INSTANCE:-background}
      - MODEL_BASE_URL=${MODEL_BASE_URL:-http://host.docker.internal:4000}
      - MODEL_API_KEY=${MODEL_API_KEY:-not-needed}
      # Leave one Host lane for interactive May while allowing App work to
      # make progress across several independent task controllers.
      - MAY_HOST_MAX_CONCURRENT=${MAY_HOST_MAX_CONCURRENT:-8}
      - CONTEXT_LEARN_AGENTS=coder,may,bob,coach,optimizer,tech-lead
      - GIT_CONFIG_COUNT=1
      - GIT_CONFIG_KEY_0=safe.directory
      - GIT_CONFIG_VALUE_0=/app/sources/aks-rp
