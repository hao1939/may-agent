name: may-agent

services:
  may:
    build:
      context: ..
      dockerfile: container/Dockerfile
    image: localhost/may-agent:latest
    container_name: may-agent
    hostname: may-agent
    restart: unless-stopped
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "6", "http://127.0.0.1:8080/api/readiness"]
      interval: 10s
      timeout: 7s
      retries: 6
      start_period: 10s
    logging:
      driver: json-file
    env_file: ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${NOVNC_PORT:-6080}:6080"
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - /app:/app
    environment:
      - INSTANCE=${INSTANCE:-background}
      - MODEL_BASE_URL=${MODEL_BASE_URL:-http://host.docker.internal:4000}
      - MODEL_API_KEY=${MODEL_API_KEY:-not-needed}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      # Leave capacity for interactive work while allowing Apps to
      # make progress across several independent task controllers.
      - MAY_HOST_MAX_CONCURRENT=${MAY_HOST_MAX_CONCURRENT:-8}
      - AGENT=${AGENT:-host}
      - CONVERSATION_APP=${CONVERSATION_APP:-}
      - CONVERSATION_ID=${CONVERSATION_ID:-}
