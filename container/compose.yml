name: may-agent

services:
  may:
    build:
      context: ..
      dockerfile: container/Dockerfile
    image: localhost/may-agent:latest
    container_name: may-agent
    hostname: may-agent
    restart: unless-stopped
    stop_grace_period: 10s
    logging:
      driver: json-file
    env_file: ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${NOVNC_PORT:-6080}:6080"
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - /app:/app
      - /home/hao/.codex:/home/hao/.codex:ro
      - /home/hao/aks-rp:/app/sources/aks-rp:ro
    environment:
      - INSTANCE=${INSTANCE:-background}
      - MAY_WEB_TERMINAL=${MAY_WEB_TERMINAL:-1}
      - MODEL_BASE_URL=${MODEL_BASE_URL:-http://host.docker.internal:4000}
      - CONTEXT_LEARN_AGENTS=coder,may,bob,coach,optimizer,tech-lead
