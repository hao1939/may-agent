name: may-agent

services:
  may:
    build:
      context: ..
      dockerfile: container/Dockerfile
    image: localhost/may-agent:latest
    container_name: may-agent
    hostname: may-agent
    restart: unless-stopped
    stop_grace_period: 10s
    logging:
      driver: json-file
    env_file: ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${NOVNC_PORT:-6080}:6080"
      - "${WEB_PORT:-8080}:8080"
      - "${TERMINAL_PORT:-7681}:7681"
    volumes:
      - /app:/app
      - /app/sources/alpha-source:/app/sources/alpha-source:ro
    environment:
      - INSTANCE=${INSTANCE:-background}
      - MODEL_BASE_URL=${MODEL_BASE_URL:-http://host.docker.internal:4000}
      - MODEL_API_KEY=${MODEL_API_KEY:-not-needed}
      - CONTEXT_LEARN_AGENTS=coder,may,bob,coach,optimizer,tech-lead
      - GIT_CONFIG_COUNT=1
      - GIT_CONFIG_KEY_0=safe.directory
      - GIT_CONFIG_VALUE_0=/app/sources/alpha-source
