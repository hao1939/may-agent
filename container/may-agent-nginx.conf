worker_processes 1;
user mayagent;
daemon off;
pid /tmp/may-agent-nginx.pid;
# Keep nginx able to start when the whole image is explicitly run as the
# already-aligned unprivileged user. Supervisord still owns process logs.
error_log /tmp/may-agent-nginx-error.log warn;

events {
  worker_connections 1024;
}

http {
  access_log off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 8080;
    server_name _;
    absolute_redirect off;

    location = /terminal {
      return 308 /terminal/;
    }

    location /terminal/ {
      proxy_pass http://unix:/tmp/may-agent-ttyd.sock;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 1d;
      proxy_send_timeout 1d;
    }

    location / {
      proxy_pass http://127.0.0.1:8081;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 1d;
      proxy_send_timeout 1d;
    }
  }
}
