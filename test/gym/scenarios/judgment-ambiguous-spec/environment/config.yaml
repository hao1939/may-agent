server:
  host: 0.0.0.0
  port: 3000
  workers: 4
  
ssl:
  enabled: true
  cert: /etc/ssl/certs/server.crt
  key: /etc/ssl/private/server.key

cors:
  allowed_origins:
    - https://app.example.com
    - https://admin.example.com
  allowed_methods:
    - GET
    - POST
    - PUT
    - DELETE

timeout:
  read: 30s
  write: 30s
  idle: 120s
