version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      # TS 7.0 removes the compiler API required by ESLint and SDK contract tests.
      # Reassess later releases against those consumers before upgrading.
      - dependency-name: typescript
        versions: ["7.0.x"]
    groups:
      pi-runtime:
        patterns: ["@earendil-works/*", "typebox"]
      maintenance:
        patterns: ["*"]
        exclude-patterns: ["@earendil-works/*", "typebox"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /container
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
