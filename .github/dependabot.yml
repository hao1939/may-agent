version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      # TS 7.0 removes the compiler API required by typescript-eslint.
      # Reassess later releases against the lint integration before upgrading.
      - dependency-name: typescript
        versions: ["7.0.x"]
      # A new type-definition major must be reviewed with the Node runtime upgrade.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      pi-runtime:
        patterns: ["@earendil-works/*", "typebox"]
      maintenance:
        patterns: ["*"]
        exclude-patterns: ["@earendil-works/*", "typebox"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /container
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
