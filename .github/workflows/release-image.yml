name: Release image

on:
  push:
    tags:
      - "v*.*.*"
  workflow_call:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-image-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish GHCR image
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="$INPUT_TAG"
          # Reusable calls retain the caller's event (usually push/main).
          # Prefer the explicit tag; only a direct tag push can supply a fallback.
          if [ -z "$tag" ] && [ "$EVENT_NAME" = push ] && [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
          fi
          if ! [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a semantic version tag such as v1.2.3." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          persist-credentials: false

      - name: Resolve source commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          # Do not publish the raw webhook through provenance or build records.
          BUILDX_METADATA_PROVENANCE: disabled
          DOCKER_BUILD_SUMMARY: "false"
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: container/Dockerfile
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.release.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
          build-args: MAY_AGENT_BUILD_COMMIT=${{ steps.source.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Link published image from the GitHub release
        id: release-notes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const digest = process.env.IMAGE_DIGEST;
            if (!/^sha256:[a-f0-9]{64}$/.test(digest ?? "")) {
              throw new Error("Image publication did not return a valid digest; release notes unchanged.");
            }
            const { owner, repo } = context.repo;
            const image = `ghcr.io/${owner}/${repo}`.toLowerCase();
            const { data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            const start = "<!-- may-container-image:start -->";
            const end = "<!-- may-container-image:end -->";
            const section = [
              start,
              "## Container image",
              "",
              `Published to [GitHub Container Registry](https://github.com/${owner}/${repo}/pkgs/container/${repo}).`,
              "",
              "Pull this release:",
              "```sh",
              `docker pull ${image}:${tag}`,
              "```",
              "",
              "Or pin the exact published image (tags can change):",
              "```sh",
              `docker pull ${image}@${digest}`,
              "```",
              end,
            ].join("\n");
            const body = release.body ?? "";
            const first = body.indexOf(start);
            const last = body.indexOf(end);
            if ((first < 0) !== (last < 0) || last < first ||
                (first >= 0 && (body.indexOf(start, first + start.length) >= 0 ||
                               body.indexOf(end, last + end.length) >= 0))) {
              throw new Error("Malformed container image section; release notes unchanged.");
            }
            const updated = first < 0
              ? `${section}\n\n${body}`
              : body.slice(0, first) + section + body.slice(last + end.length);
            if (updated !== body) {
              await github.rest.repos.updateRelease({ owner, repo, release_id: release.id, body: updated });
            }
