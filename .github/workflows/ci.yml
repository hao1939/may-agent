name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan publication files for secrets
        shell: bash
        run: |
          privacy_tool_dir="$(mktemp -d)"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$privacy_tool_dir/gitleaks.tar.gz"
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "$privacy_tool_dir/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$privacy_tool_dir/gitleaks.tar.gz" -C "$privacy_tool_dir" gitleaks
          "$privacy_tool_dir/gitleaks" dir . --config .gitleaks.toml --redact=100 --no-banner
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Type, architecture, and lint checks
        run: bun run check:ci
      - name: Verify browser prerequisites
        run: google-chrome --version
      - name: Unit, integration, daemon, browser, and script tests
        run: |
          mkdir -p test-results
          bun run test --reporter=junit --reporter-outfile=test-results/junit.xml
      - name: Keep test results, including failures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  container:
    name: Container
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select image validation
        id: image
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            needed=$(git diff --name-only -z --no-renames "$BASE_SHA" HEAD | bash scripts/ci-container-needed.sh)
          else
            needed=true
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
          if [[ "$needed" == false ]]; then
            echo 'Container build not needed: only documentation or portable tests changed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        if: steps.image.outputs.needed == 'true'
      - name: Build the shipped Linux image without publishing
        if: steps.image.outputs.needed == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          # Build provenance/records can embed the raw webhook, including
          # private pusher emails. Keep ordinary build and smoke diagnostics.
          BUILDX_METADATA_PROVENANCE: disabled
          DOCKER_BUILD_SUMMARY: "false"
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: container/Dockerfile
          load: true
          provenance: false
          tags: may-agent:ci
          build-args: MAY_AGENT_BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha
          # Main/manual runs seed the shared cache; PRs reuse it without
          # spending minutes uploading a private per-PR image cache.
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}
      - name: Exercise the image in an isolated container
        if: steps.image.outputs.needed == 'true'
        run: bash scripts/ci-container-smoke.sh may-agent:ci "$GITHUB_SHA"
      - name: Keep container diagnostics, including failures
        if: ${{ !cancelled() && steps.image.outputs.needed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
