litellm_settings:
  drop_params: true

model_list:
# gpt-5.5: responses API only
- model_name: "gpt-5.5"
  litellm_params:
    model: "github_copilot/gpt-5.5"
    drop_params: true
    extra_headers:
      editor-version: "vscode/1.95.0"
      editor-plugin-version: "copilot-chat/0.26.7"

# Wildcard: everything else via chat/completions
- model_name: "*"
  litellm_params:
    model: "github_copilot/*"
    drop_params: true
    extra_headers:
      editor-version: "vscode/1.95.0"
      editor-plugin-version: "copilot-chat/0.26.7"
