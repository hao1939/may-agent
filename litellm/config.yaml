litellm_settings:
  drop_params: true
  num_retries: 3
  retry_after: 5
  request_timeout: 120

model_list:
- model_name: "*"
  litellm_params:
    model: "github_copilot/*"
    drop_params: true
    extra_headers:
      editor-version: "vscode/1.95.0"
      editor-plugin-version: "copilot-chat/0.26.7"
