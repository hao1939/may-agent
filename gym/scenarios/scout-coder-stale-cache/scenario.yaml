name: scout-coder-stale-cache
category: scout-coder
tier: 3
description: >
  A stream processing pipeline has broken — event aggregation produces wrong
  window counts. Tests fail in the formatter/reporter layer. The root cause
  is a subtle ordering change in the data source that breaks the aggregator's
  assumption about sorted timestamps.

setup: |
  cd $SCENARIO_DIR
  export PATH=".state/.bun/bin:$PATH"

test_command: |
  cd $SCENARIO_DIR
  .state/.bun/bin/bun test pipeline.test.ts 2>&1

files:
  - src/source.ts
  - src/aggregator.ts  
  - src/formatter.ts
  - src/pipeline.ts
  - pipeline.test.ts

bug_location: src/source.ts
bug_description: >
  source.ts was refactored to sort events by ID instead of by timestamp.
  The aggregator relies on timestamp-sorted input to detect window boundaries.
  With ID-sorted input, events arrive out of temporal order, causing the
  aggregator to close windows prematurely and miscount events.
fix_hint: "In source.ts, change the sort comparator from sorting by id to sorting by timestamp"

scorecard:
  product_checks:
    - name: all-tests-pass
      command: cd $SCENARIO_DIR && .state/.bun/bin/bun test pipeline.test.ts 2>&1
      expect_contains: "0 fail"
    - name: window-counts-correct
      command: cd $SCENARIO_DIR && .state/.bun/bin/bun test pipeline.test.ts 2>&1
      expect_contains: "pass"
    - name: no-event-loss
      command: cd $SCENARIO_DIR && .state/.bun/bin/bun test pipeline.test.ts 2>&1
      expect_not_contains: "event loss"
  behavioral_checks:
    - name: fix-is-minimal
      command: cd $SCENARIO_DIR && git diff --stat 2>/dev/null | tail -1 || echo "1 file changed"
      expect_contains: "1 file"
    - name: source-was-modified
      command: cd $SCENARIO_DIR && git diff --name-only 2>/dev/null || find . -name '*.ts.bak' | head -1 || echo "src/source.ts"
      expect_contains: "source"
