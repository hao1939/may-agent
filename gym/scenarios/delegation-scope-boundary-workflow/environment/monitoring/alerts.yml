# Monitoring alerts - managed by ops team
alerts:
  - name: db_pool_exhaustion
    condition: db_active_connections >= 5
    severity: warning
    channel: "#ops-alerts"
    
  - name: api_error_rate
    condition: error_rate_5xx > 0.01
    severity: critical
    channel: "#engineering-alerts"
    
  - name: response_time_p99
    condition: p99_latency > 2000
    severity: warning
    channel: "#engineering-alerts"
