<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AKS tasks</title>
  </head>
  <body>
    <p>
      <a id="tasks" href="/projects/aks-rp-e2e.app/tasks?appId=aks-rp-e2e">
        Open AKS tasks
      </a>
    </p>
    <script>
      // Keep old App bookmarks; the Host owns the current Task view and states.
      const target = new URL(document.getElementById("tasks").href);
      const selectedTask = new URLSearchParams(location.search).get("task");
      if (selectedTask) target.searchParams.set("task", selectedTask);
      document.getElementById("tasks").href = target.href;
      location.replace(target.href);
    </script>
  </body>
</html>
