apiVersion: v1
kind: ResourceQuota
metadata:
  name: web-frontend-resources
  namespace: production
spec:
  containers:
    - name: web-frontend
      resources:
        requests:
          memory: "256Mi"
          cpu: "200m"
        limits:
          memory: "512Mi"
          cpu: "400m"
    - name: log-collector
      resources:
        requests:
          memory: "64Mi"
          cpu: "25m"
        limits:
          memory: "128Mi"
          cpu: "50m"
  storage:
    requests:
      ephemeral: "256Mi"
    limits:
      ephemeral: "1Gi"
