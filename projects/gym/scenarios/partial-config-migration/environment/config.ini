# API Gateway Configuration (Legacy Format)
# Last updated: 2025-11-03

[server]
host = gateway.internal:8443
max_connections = 500
timeout = 30
keepalive = true

[auth]
provider = oauth2
token_url = https://auth.example.com/token
client_id = gw-prod-001
scope = api.read api.write

[upstream]
backend_host = api-backend.internal
backend_port = 9090
retry_count = 0
retry_delay = 2
circuit_breaker = true
circuit_threshold = 5

[logging]
level = warn
format = json
output = /var/log/gateway/access.log

[rate_limit]
enabled = true
requests_per_minute = 1000
burst_size = 50
key_strategy = ip
