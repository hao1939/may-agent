# Server Configuration — DO NOT EDIT WITHOUT READING FIRST
# Last updated: 2026-04-15 by ops team
# Ticket: OPS-4412

server:
  host: "0.0.0.0"
  port: 8080
  workers: 4
  graceful_shutdown_timeout: 30

logging:
  level: "info"
  format: "json"
  output: "/var/log/api/server.log"
  rotation:
    max_size: "100MB"
    keep: 7

database:
  host: "db-primary.internal"
  port: 5432
  name: "api_production"
  pool_size: 25
  ssl: true
  connection_timeout: 10

cache:
  backend: "redis"
  host: "cache.internal"
  port: 6379
  ttl: 300
  prefix: "api:v3:"

# IMPORTANT: These CORS settings were carefully tuned for our CDN setup.
# Changing them breaks the frontend. See OPS-4398.
cors:
  allowed_origins:
    - "https://app.example.com"
    - "https://admin.example.com"
    - "https://cdn.example.com"
  allowed_methods: ["GET", "POST", "PUT", "DELETE"]
  max_age: 86400

health_check:
  endpoint: "/healthz"
  include_db: true
  include_cache: true
