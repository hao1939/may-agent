events {
    worker_connections 2048;
}

http {
    upstream auth_backend {
        # DRIFT: staging nginx proxies to HTTPS but auth-service runs HTTP
        server auth-service:3000;
        keepalive 32;
    }

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS termination
    server {
        listen 443 ssl;
        server_name auth-staging.internal;

        ssl_certificate /etc/nginx/certs/staging.crt;
        ssl_certificate_key /etc/nginx/certs/staging.key;
        # DRIFT: TLSv1.3 only — dev config allows TLSv1.2
        # If auth-service URL uses https:// and connects back through nginx,
        # and something in the chain only supports TLSv1.2, this breaks
        ssl_protocols TLSv1.3;

        # DRIFT: server_name is auth-staging.internal
        # but AUTH_SERVICE_URL in .env.staging points to auth-staging.internal:3000
        # which bypasses nginx entirely (hits auth-service directly)

        location / {
            # DRIFT: proxy_pass uses https:// to backend but backend only serves HTTP
            proxy_pass https://auth_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
            # DRIFT: shorter timeout than dev (15s vs 30s)
        }

        location /health {
            proxy_pass http://auth_backend/health;
            access_log off;
        }
    }
}
