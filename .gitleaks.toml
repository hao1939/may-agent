description = "Constructed persistence-redaction test values"
condition = "AND"
paths = ['''(?:^|/)(?:src/lib/persistence-redaction\.test\.ts|test/unit/transcript-redaction\.test\.ts|\.gitleaks\.toml)$''']
regexTarget = "secret"
regexes = [
